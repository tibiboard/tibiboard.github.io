<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はしれ!ばつべー</title>
<script src="asobi_common.js"></script>
<style>
:root{--pink:#e84898;--pink-deep:#e0197a;--mint:#3ec9c2;--mint-deep:#1f8f8a;--ink:#33474f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f2fbfa;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 10px 30px;user-select:none;-webkit-user-select:none;overflow-x:hidden}
h1{font-size:clamp(32px,5.5vw,54px);letter-spacing:3px;color:var(--mint-deep);margin:4px 0 6px}
.fuda{background:#fff;color:var(--ink);border-radius:18px;padding:15px 20px;font-size:19px;line-height:1.8;max-width:440px;margin:6px 0;border-left:9px solid var(--mint)}
.fuda b{color:var(--pink-deep)}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.pill{background:#fff;border:3px solid var(--mint);border-radius:999px;padding:9px 24px;font-weight:900;font-size:20px}
.pill b{color:#c8940a;font-size:30px}
.pill.timer b{color:var(--mint-deep);font-variant-numeric:tabular-nums;min-width:2.4em;display:inline-block;text-align:center}
.pill.timer.warn{border-color:var(--pink);background:#ffe9f3}
.pill.timer.warn b{color:var(--pink-deep)}
#mute{background:#fff;border:3px solid var(--mint);border-radius:999px;width:60px;height:60px;font-size:26px;cursor:pointer}
/* フィールド: 画面いっぱい */
#field{position:relative;width:min(560px,96vw);height:min(62vh,560px);background:#fff;border:5px solid var(--mint);border-radius:27px;box-shadow:0 6px 21px rgba(31,143,138,.15);overflow:hidden;touch-action:manipulation;cursor:crosshair}
#rab{position:absolute;width:58px;height:92px;will-change:transform;-webkit-tap-highlight-color:transparent}
#rab img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.ghost{position:absolute;width:58px;height:92px;pointer-events:none;opacity:.35;animation:gh .35s linear forwards}
.ghost img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes gh{to{opacity:0}}
#rab.hit{animation:pop .5s forwards}
@keyframes pop{30%{transform:scale(1.4) rotate(-8deg)}100%{transform:scale(1.25)}}
#startbtn{position:absolute;inset:0;background:rgba(242,251,250,.92);border:0;font-family:inherit;font-size:clamp(28px,4.5vw,36px);font-weight:900;color:var(--mint-deep);cursor:pointer;letter-spacing:2px;line-height:2}
#msg{min-height:2.2em;text-align:center;font-weight:900;font-size:20px;margin-top:8px;line-height:1.6}
.flycoin{position:fixed;font-size:40px;z-index:60;pointer-events:none;animation:fly 1s forwards}
@keyframes fly{to{transform:translateY(-90px) scale(.6);opacity:0}}
#ov{position:fixed;inset:0;background:rgba(242,251,250,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center}
#ov img{width:200px;animation:bounce .6s}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#ov .big{font-size:clamp(36px,6vw,48px);font-weight:900;color:var(--pink-deep);letter-spacing:3px;margin:8px 0}
#ov .sub{font-size:20px;font-weight:900;color:var(--mint-deep);margin-bottom:14px;line-height:1.8}
.btn{display:inline-block;padding:20px 38px;border-radius:20px;border:0;border-bottom:9px solid var(--mint-deep);background:var(--mint);color:#fff;font-weight:900;font-size:26px;cursor:pointer;letter-spacing:2px;font-family:inherit;text-decoration:none;margin:4px}
.btn:active{border-bottom-width:3px;transform:translateY(6px)}
.btn.pink{background:var(--pink);border-bottom-color:var(--pink-deep)}
.links{margin-top:12px;text-align:center}
.links .btn{font-size:20px;padding:16px 26px}
.confetti{position:fixed;width:13px;height:19px;top:-20px;z-index:55;pointer-events:none;animation:conf 2s linear forwards}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}

/* ===== クリィミーマミ配色(2026-08-15全ページ統一)。旧値: pink#e0197a/deep#b81163/mint#3ec9c2/mint-deep#127a75 ===== */
:root{
  --pink:#ee85b5; --pink-deep:#c9679c; --pink-pale:#fbe7f1;
  --mint:#9dd8c8; --mint-pale:#eef8f3; --mint-deep:#6a9fc0;
  --gold:#f2d98a;
}
</style>
</head>
<body>
<h1>🏃 はしれ!ばつべー</h1>
<div class="fuda">はしりまわる ばつべーを <b>4秒いない</b>にタップ! せいこうで <b>🪙</b><br>
<span style="font-size:18px;opacity:.8">なんかいでも あそべて 🪙は なんまいでも たまるよ</span></div>
<div class="bar">
  <div class="pill">🪙 <b id="coins">0</b> コイン</div>
  <div class="pill timer" id="timerpill">⏱ <b id="timer">4.0</b></div>
  <button id="mute" title="おとのON/OFF">🔊</button>
</div>
<div id="field">
  <div id="rab"><img id="rabimg" src="" alt="ばつべー"></div>
  <button id="startbtn">▶ タップで スタート!<br><span style="font-size:19px">4秒いないに ばつべーを つかまえろ!</span></button>
</div>
<div id="msg">じゅんびは いい?</div>
<div class="links">
  <a class="btn" href="shop/index.html?in=1">◀ お店にもどる</a>
</div>

<div id="ov">
  <img id="ovimg" src="">
  <div class="big"></div>
  <div class="sub" id="ovsub"></div>
  <button class="btn" id="next"></button>
  <br><a class="btn" id="ovback" style="background:#8fb3b0;border-bottom-color:#5f8a87;font-size:20px;padding:16px 28px" href="shop/index.html?in=1">◀ お店にもどる</a>
</div>

<script>
const C=window.CHIBI;
const $=id=>document.getElementById(id);

/* ===== 音(WebAudio自作・ミュート付き。うさぎ探しとおなじトーン) ===== */
let AC=null, muted=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq,t0,dur,type,gain,slide){
  if(muted) return;
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime+t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+t0+dur);
  g.gain.setValueAtTime(gain||0.15,a.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  o.connect(g);g.connect(a.destination);
  o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05);
}
function sndPinpon(){ tone(880,0,0.18,'sine',0.2); tone(1319,0.16,0.5,'sine',0.2); }
function sndCoin(){ tone(1568,0,0.08,'square',0.1); tone(2093,0.07,0.25,'square',0.1); }
function sndNo(){ tone(392,0,0.25,'triangle',0.12,300); tone(311,0.25,0.4,'triangle',0.12,250); }
function sndBonus(){ [1047,1319,1568,2093].forEach((f,i)=>tone(f,i*0.08,0.3,'square',0.1)); }
function sndDash(){ tone(600,0,0.12,'sawtooth',0.06,1400); }
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'🔇':'🔊'; };

/* ===== コイン表示 ===== */
function showCoins(){ $('coins').textContent=C.getCoins(); }
showCoins();

/* ===== ばつべー(ランダムうさぎ1匹) ===== */
const rabId=C.drawCard();
$('rabimg').src=C.DIR+rabId+'.png';

/* ===== 走行: 直線+急カーブのランダム軌道・超高速 ===== */
const LIMIT=4.0;
let running=false, raf=0, tHandle=null, tEnd=0, lastGhost=0;
let x=60,y=60, ang=0, turn=0, nextChange=0;
const RW=58, RH=92;
function fieldSize(){ const f=$('field'); return [f.clientWidth,f.clientHeight]; }
function speed(){ const [W,H]=fieldSize(); return Math.max(W,H)*2.2; } /* 画面幅の2.2倍/秒=残像級 */
function loop(now){
  if(!running) return;
  if(!loop.prev) loop.prev=now;
  const dt=Math.min((now-loop.prev)/1000,0.04); loop.prev=now;
  const [W,H]=fieldSize();
  /* 軌道: 一定時間ごとに「直線」か「急カーブ」をランダム切替 */
  if(now>=nextChange){
    if(Math.random()<0.45){ turn=0; }                                  /* 直線 */
    else { turn=(Math.random()<0.5?-1:1)*(8+Math.random()*10); }       /* 急カーブ(rad/s) */
    if(Math.random()<0.25){ ang+=Math.PI*(0.5+Math.random()); sndDash(); } /* たまに瞬間ターン */
    nextChange=now+120+Math.random()*380;
  }
  ang+=turn*dt;
  const v=speed();
  x+=Math.cos(ang)*v*dt; y+=Math.sin(ang)*v*dt;
  /* 壁で反射 */
  if(x<0){x=0; ang=Math.PI-ang;} if(x>W-RW){x=W-RW; ang=Math.PI-ang;}
  if(y<0){y=0; ang=-ang;} if(y>H-RH){y=H-RH; ang=-ang;}
  const r=$('rab');
  r.style.transform='translate('+x+'px,'+y+'px)'+(Math.cos(ang)<0?' scaleX(-1)':'');
  /* 残像 */
  if(now-lastGhost>45){
    lastGhost=now;
    const g=document.createElement('div'); g.className='ghost';
    g.style.transform=r.style.transform;
    g.innerHTML='<img src="'+C.DIR+rabId+'.png">';
    $('field').appendChild(g); setTimeout(()=>g.remove(),360);
  }
  raf=requestAnimationFrame(loop);
}
function startTimer(){
  tEnd=performance.now()+LIMIT*1000;
  $('timerpill').classList.remove('warn');
  tHandle=setInterval(()=>{
    const left=Math.max(0,(tEnd-performance.now())/1000);
    $('timer').textContent=left.toFixed(1);
    if(left<=1.5) $('timerpill').classList.add('warn');
    if(left<=0) timeUp();
  },100);
  $('timer').textContent=LIMIT.toFixed(1);
}
function stopAll(){ running=false; cancelAnimationFrame(raf); if(tHandle){clearInterval(tHandle);tHandle=null;} loop.prev=0; }

function startRun(){
  const [W,H]=fieldSize();
  x=Math.random()*(W-RW); y=Math.random()*(H-RH); ang=Math.random()*Math.PI*2; turn=0; nextChange=0;
  running=true; $('rab').classList.remove('hit'); $('rab').style.display='block';
  $('msg').textContent='つかまえろ〜!!';
  sndDash();
  startTimer();
  raf=requestAnimationFrame(loop);
}
$('startbtn').onclick=()=>{ $('startbtn').style.display='none'; startRun(); };

/* タップ判定: うさぎ本体+すこし甘め(指でも追える) */
$('field').addEventListener('pointerdown',e=>{
  if(!running) return;
  const fr=$('field').getBoundingClientRect();
  const px=e.clientX-fr.left, py=e.clientY-fr.top;
  const PAD=16;
  if(px>=x-PAD && px<=x+RW+PAD && py>=y-PAD && py<=y+RH+PAD){ catchRab(); }
});

function catchRab(){
  stopAll();
  /* 回数制限なし: 成功のたびに毎回🪙+1(2026-08-14たけろう指示) */
  C.markGameDone('run');           /* パーフェクトボーナス判定用の日次記録だけは残す */
  C.addCoins(1); showCoins(); sndPinpon(); sndCoin();
  let perfect=C.tryPerfect();      /* 両ゲーム成功なら+1🪙(1日1回だけの特別ボーナス) */
  showCoins();
  flyCoin($('rab'));
  $('rab').classList.add('hit');
  if(perfect){ confetti(); sndBonus(); }
  setTimeout(()=>{
    $('ovimg').src=C.DIR+rabId+'.png';
    document.querySelector('#ov .big').textContent='🎯 つかまえた!!';
    $('ovsub').innerHTML='🪙 +1コイン'
        +(perfect?'<br><span style="color:#e0197a">🎉 きょうのパーフェクト!+1🪙</span>':'')
        +'<br>ごうけい '+C.getCoins()+' コイン';
    $('next').textContent='もういちど あそぶ ▶';
    $('next').dataset.retry='1';
    $('ovback').style.display='inline-block';
    $('ov').style.display='flex';
  },600);
}
function timeUp(){
  stopAll(); sndNo();
  $('ovimg').src=C.DIR+rabId+'.png';
  document.querySelector('#ov .big').textContent='💨 にげられた!';
  $('ovsub').innerHTML='ばつべーは はやかった…<br>コインはなし。でも その場で もういちど!';
  $('next').textContent='もういちど ちょうせん ▶';
  $('next').dataset.retry='1';
  $('ovback').style.display='inline-block';
  $('ov').style.display='flex';
}
$('next').onclick=()=>{
  $('ov').style.display='none';
  if($('next').dataset.retry){
    /* スタート待ちに戻る(勝手に始めない — 2026-08-11たけろう指示) */
    $('startbtn').style.display='block';
    $('timer').textContent=LIMIT.toFixed(1); $('timerpill').classList.remove('warn');
    $('msg').textContent='じゅんびは いい?';
  }
  else { location.href='shop/index.html?in=1'; }
};

function flyCoin(el){
  const r=el.getBoundingClientRect();
  const c=document.createElement('div');
  c.className='flycoin'; c.textContent='🪙';
  c.style.left=(r.left+r.width/2-13)+'px'; c.style.top=(r.top)+'px';
  document.body.appendChild(c); setTimeout(()=>c.remove(),1000);
}
function confetti(){
  const cols=['#e84898','#3ec9c2','#ffd54f','#9a3ac8','#fff'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%5];
    c.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),2800);
  }
}

/* あそぶのもコイン獲得も無制限(2026-08-14〜) */
</script>
</body>
</html>
