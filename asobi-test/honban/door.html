<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>とびら — ちびボード</title>
<script src="data/商品リスト.js"></script>
<style>
:root{--pink:#e84898;--pink-deep:#e0197a;--pink-pale:#ffe3f0;--mint:#5fd6c4;--mint-deep:#1fae99;--ink:#3a2233;--dark:#180a14}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--dark);color:#fff;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{background:linear-gradient(135deg,var(--pink-pale),#fff);color:var(--ink);border-radius:22px;padding:32px 26px;
  max-width:420px;width:100%;border:4px solid var(--pink-deep);box-shadow:0 0 40px 8px rgba(232,72,152,.4)}
.card .ico{font-size:48px;margin-bottom:10px}
.card h1{font-size:20px;font-weight:900;margin-bottom:10px;letter-spacing:1px}
.card p{font-size:14px;line-height:1.9;color:#5c4152;margin-bottom:18px}
.gobtn{display:inline-block;background:var(--pink);color:#fff;border-radius:14px;padding:16px 30px;font-weight:900;font-size:16px;
  text-decoration:none;border-bottom:7px solid var(--pink-deep)}
.gobtn:active{border-bottom-width:2px;transform:translateY(5px)}
.gobtn.disabled{background:#c9bcc5;border-color:#a89ba3;pointer-events:none}
.note{margin-top:18px;font-size:12px;color:#8a6a7d;line-height:1.8}
.back{position:fixed;left:14px;top:14px;color:#8d7f89;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<a class="back" href="index.html">← もどる</a>
<div class="card" id="card"></div>

<script>
const CONF = window.SHOP_CONFIG || {sponsor_week:false};
const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const card = document.getElementById('card');

if (CONF.sponsor_week){
  card.innerHTML = `<div class="ico">🌸</div>
    <h1>こんかいは かんばい</h1>
    <p>今回のドロップは、スポンサー・貢献者さまへの先行お迎え枠が中心です。<br>券は次のドロップまで有効です。あそんでくれてありがとう🐰</p>`;
} else if (!token){
  card.innerHTML = `<div class="ico">🕳</div>
    <h1>このとびらは まだ ひらかない</h1>
    <p>正しい「とびらのばしょ」からきてね。ゲームで あたりを ひくと URLが わかるよ。</p>`;
} else {
  const baseUrl = CONF.base_url || '';
  card.innerHTML = `<div class="ico">🐰</div>
    <h1>ようこそ。この子に会えるのは きみだけ</h1>
    <p>先行入場の券が ひらきました。下のボタンから おみせに はいれます。<br>この券は <b>次のドロップまで</b> 有効です。ブックマークして 忘れずに。</p>
    ${baseUrl
      ? `<a class="gobtn" href="${baseUrl}" target="_blank" rel="noopener">おみせに はいる ▶</a>`
      : `<span class="gobtn disabled">じゅんびちゅう…</span><p class="note">お店のURLはまだ設定されていません(data/商品リスト.js の base_url)</p>`}
    <div class="note">うまくひらけないときは BASEで「ちびボード」と けんさく</div>`;
}
</script>
</body>
</html>
