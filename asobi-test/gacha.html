<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ちびガチャ 体験版</title>
<style>
:root{--pink:#e84898;--pink-deep:#e0197a;--mint:#5fd6c4;--ink:#3a2233}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;background:#120818;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;user-select:none;overflow-x:hidden}
.back{align-self:flex-start;color:#8d7f89;font-size:13px;text-decoration:none;margin-bottom:6px}
h1{font-size:20px;letter-spacing:4px;color:var(--mint);margin:8px 0 4px}
.fuda{background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;font-size:12.5px;line-height:1.9;max-width:420px;margin:10px 0;border-left:6px solid var(--mint)}
.fuda b{color:var(--pink-deep)}
.coin{font-size:15px;font-weight:900;margin:8px 0;background:#2a1a33;border-radius:999px;padding:8px 22px}
.coin b{font-size:22px;color:#ffd54f}
.pull{margin:14px 0;width:230px;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--pink),#9a3ac8);border:0;border-bottom:8px solid #6a1a8a;font-weight:900;font-size:19px;color:#fff;cursor:pointer;letter-spacing:3px}
.pull:active{border-bottom-width:2px;transform:translateY(6px)}
.pull:disabled{opacity:.35}
/* ===== 演出オーバーレイ ===== */
#ov{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:50;overflow:hidden}
.circle{position:absolute;width:340px;height:340px;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,#7a3ac8 0 30deg,transparent 30deg 60deg,#7a3ac8 60deg 90deg,transparent 90deg 120deg,#7a3ac8 120deg 150deg,transparent 150deg 180deg,#7a3ac8 180deg 210deg,transparent 210deg 240deg,#7a3ac8 240deg 270deg,transparent 270deg 300deg,#7a3ac8 300deg 330deg,transparent 330deg);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 58%,#000 60%,#000 70%,transparent 72%)}
.circle.go{opacity:1;animation:cspin 2.6s linear infinite}
.circle.gold{filter:hue-rotate(120deg) saturate(2) brightness(1.5)}
.circle.rainbow{animation:cspin 1s linear infinite, hue 1.2s linear infinite;filter:saturate(2.4) brightness(1.7)}
@keyframes cspin{to{transform:rotate(360deg)}}
@keyframes hue{to{filter:hue-rotate(360deg) saturate(2.4) brightness(1.7)}}
.orb{position:absolute;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e84898 60%,#7a1a5a);opacity:0;transform:scale(.2)}
.orb.go{opacity:1;animation:orbdrop .8s cubic-bezier(.3,0,.5,1.4) forwards}
@keyframes orbdrop{from{transform:translateY(-60vh) scale(.4)}to{transform:translateY(0) scale(1)}}
.orb.shake{animation:oshake .35s 3}
@keyframes oshake{25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .6s}
@keyframes fl{12%{opacity:1}100%{opacity:0}}
.confetti{position:absolute;width:9px;height:13px;top:-20px;animation:conf 2.2s linear forwards}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}
/* カード */
.card{position:relative;width:230px;border-radius:18px;padding:20px 16px;text-align:center;opacity:0;transform:scale(.4);transition:all .45s cubic-bezier(.2,1.5,.4,1);z-index:2}
.card.go{opacity:1;transform:scale(1)}
.card img{width:120px}
.card .rar{font-size:13px;font-weight:900;letter-spacing:4px;margin-bottom:4px}
.card .nm{font-size:18px;font-weight:900;margin-top:6px}
.card.n{background:#3a3a42;border:3px solid #7a7a85}.card.n .rar{color:#c5cbd4}
.card.r{background:#1a3a5c;border:3px solid #4a9df0}.card.r .rar{color:#8fd0ff}
.card.ssr{background:linear-gradient(160deg,#4a2a00,#7a5a10);border:4px solid #ffd54f;box-shadow:0 0 44px 8px #ffd54f88}
.card.ssr .rar{color:#ffd54f;font-size:16px}
.card .tobira-btn{display:inline-block;background:var(--pink);color:#fff;border-radius:10px;padding:12px 24px;text-decoration:none;margin-top:10px;font-weight:900;border-bottom:5px solid var(--pink-deep)}
.card .note{font-size:10.5px;margin-top:8px;color:#f0e6d2;line-height:1.7}
.skip{position:absolute;right:16px;bottom:14px;color:#fff;opacity:.5;font-size:12px;cursor:pointer;z-index:3}
/* ===== SSR専用の大暴れ演出 ===== */
.rays{position:absolute;width:1400px;height:1400px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(#ffd54f 0 7deg, transparent 7deg 14deg)}
.rays.go{opacity:.4;animation:rspin 10s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
.ssrtext{position:absolute;font-size:110px;font-weight:900;letter-spacing:8px;z-index:4;opacity:0;
  color:#ffd54f;text-shadow:0 0 30px #ffd54f,0 0 80px #ff8a00,4px 4px 0 #7a4a00;pointer-events:none}
.ssrtext.slam{animation:slam .6s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(7) rotate(-8deg)}60%{opacity:1;transform:scale(0.92)}100%{opacity:1;transform:scale(1)}}
.ssrtext.fadeup{animation:fadeup .8s .9s forwards}
@keyframes fadeup{to{opacity:0;transform:translateY(-120px) scale(1.1)}}
#ov.quake{animation:quake .55s}
@keyframes quake{0%,100%{transform:translate(0)}12%{transform:translate(-14px,8px)}25%{transform:translate(12px,-10px)}38%{transform:translate(-10px,-6px)}52%{transform:translate(10px,8px)}68%{transform:translate(-7px,4px)}84%{transform:translate(6px,-4px)}}
.flash.gold{background:radial-gradient(circle,#fff,#ffd54f 60%,#ff8a00)}
/* SSR: 画面全体が明滅し続ける大発光 */
.flash.strobe{animation:strobe 1.6s}
@keyframes strobe{0%{opacity:1}14%{opacity:.2}24%{opacity:.95}38%{opacity:.25}50%{opacity:.85}66%{opacity:.2}80%{opacity:.6}100%{opacity:0}}
#ov.ssrbg{background:radial-gradient(circle at 50% 45%, #7a5a10, #3a2a00 55%, #000)}
/* ハズレ用: レア度色のやわらか閃光 */
.flash.blue{background:radial-gradient(circle,#fff,#4a9df0 70%)}
.flash.soft{background:radial-gradient(circle,#fff,#8d7f89 70%)}
.flash.weak{animation:flweak .5s}
@keyframes flweak{15%{opacity:.6}100%{opacity:0}}
/* カードのキラッと光るスイープ(全レア共通のご褒美感) */
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 48%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.card.go::after{animation:shine 1s .25s}
@keyframes shine{to{transform:translateX(120%)}}
#msg{min-height:2.4em;text-align:center;font-weight:900;font-size:14px;margin-top:6px;line-height:1.8}
.reset{margin-top:14px;font-size:12px;color:#8d7f89;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<a class="back" href="index.html">← もどる</a>
<h1>🔮 ちびガチャ</h1>
<div class="fuda">💡 <b>なにがあたるの?</b><br>
まわすと「うさぎカード」が1まいでます。<b>SSR🌟</b>がでると、つぎの新作キーボードを<b>2時間はやく</b>買いにいける「とびらのばしょ」つき。<b>お金はかかりません。</b></div>
<div class="coin">🪙 コイン: <b id="coins">3</b> 枚(のこり<span id="left">3</span>回)</div>
<button class="pull" id="pull">ガチャをまわす ▶</button>
<div id="msg">きょうのゲームにかったので、3回まわせます🐰</div>
<div class="reset" onclick="location.reload()">(体験版: やりなおす)</div>

<div id="ov">
  <div class="rays" id="rays"></div>
  <div class="circle" id="circle"></div>
  <div class="orb" id="orb"></div>
  <div class="flash" id="flash"></div>
  <div class="card" id="card"></div>
  <div class="ssrtext" id="ssrtext">SSR</div>
  <div class="skip" onclick="endPull(true)">スキップ ▶▶</div>
</div>

<script>
/* ===== 音(全部自作・音源ファイルなし) ===== */
let AC, MASTER;
function ac(){
  if(!AC){
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value=-28; comp.knee.value=8; comp.ratio.value=14;
    comp.attack.value=0.002; comp.release.value=0.18;
    MASTER = AC.createGain(); MASTER.gain.value=1.6;
    MASTER.connect(comp); comp.connect(AC.destination);
  }
  return AC;
}
function out(){ ac(); return MASTER; }
function tone(freq,t0,dur,type='sine',gain=0.15,slide=0){
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+t0+dur);
  g.gain.setValueAtTime(gain,a.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  o.connect(g);g.connect(out());
  o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05);
}
function sndRiser(){ tone(120,0,1.6,'sawtooth',0.10,960); tone(60,0,1.6,'sine',0.14,240) }          /* 溜め上昇 */
function sndHeart(){ [0,0.5,0.95,1.3].forEach(t=>tone(55,t,0.18,'sine',0.28)) }                    /* 鼓動 */
function sndBoom(){ tone(70,0,0.5,'sine',0.4,40); tone(400,0,0.12,'square',0.12) }                 /* 破裂 */
function sndRainbow(){ [660,880,1175,1568,2093].forEach((f,i)=>tone(f,i*0.09,0.5,'sine',0.12)) }   /* 虹変色 */
function sndSSR(){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*0.11,0.6,'square',0.10)); tone(2093,0.7,1.0,'sine',0.14) } /* ファンファーレ */
function sndCard(){ tone(880,0,0.1,'square',0.12); tone(1320,0.08,0.15,'square',0.10) }
/* バンドパスノイズ(ガコッの箱鳴り成分) */
function knock(t0, dur, freq, gain){
  const a=ac(), len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=2.5;
  const g=a.createGain(); g.gain.setValueAtTime(gain,a.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  s.connect(f); f.connect(g); g.connect(out());
  s.start(a.currentTime+t0);
}
/* SSR着地=「ガゴォッ!!!」爆発版(スロットより半音上+キラの大尾) */
function sndPekaBass(){
  /* 低音の壁12層(スロットよりわずかに高いチューニング) */
  [38,41,44,48,52,56,61,66,72,78,85,92].forEach((f,i)=>
    tone(f, 0, 0.9-i*0.03, 'sine', 0.55, f*0.82));
  [105,122,142,165,190,220].forEach((f,i)=>
    tone(f, 0.01, 0.3-i*0.02, i%2?'triangle':'sine', 0.45, f*0.5));
  [155,200,255].forEach(f=>tone(f,0,0.08,'square',0.5,f*0.5));
  knock(0, 0.25, 280, 1.4);
  knock(0, 0.22, 620, 1.4);
  knock(0, 0.18, 1000, 1.0);
  [1175,1397,1568,1865,2093,2349,2637,2960,3136,3729].forEach((f,i)=>
    tone(f, 0.015, 0.8-i*0.05, 'triangle', 0.22-i*0.015));
  [4186,4699,5274,5920,6272].forEach((f,i)=>tone(f,0.05+i*0.03,0.6,'sine',0.08));
  knock(0.16, 0.3, 440, 1.2);
  [42,50,58].forEach(f=>tone(f,0.16,0.5,'sine',0.5,f*0.8));
  /* キラキラの大尾(ガチャの色) */
  [2093,2637,3136,3951].forEach((f,i)=>tone(f,0.4+i*0.1,1.4,'sine',0.10-i*0.02));
}
/* ハズレ用のご褒美ジングル(R=きらり3音 / N=ぽん+ちり) */
function sndR(){ [659,880,1319].forEach((f,i)=>tone(f,i*0.09,0.35,'square',0.13)); tone(1760,0.3,0.6,'sine',0.08) }
function sndN(){ tone(523,0,0.12,'square',0.12); tone(1047,0.1,0.3,'sine',0.08) }

/* ===== 排出テーブル: 体験版はSSR20%(本番1.7%)。N/Rはうさぎカード ===== */
const P_SSR = 0.20;
const RAB = ["cute_01","cute_04","cute_15","edgy_11","street_02","street_05"];
const NAMES = {cute_01:'ももはね',cute_04:'みんとみみ',cute_15:'そらまめ',edgy_11:'とがりみみ',street_02:'まちかど',street_05:'ふらっと'};
let coins=3, pulling=false, cur=null;
const $=id=>document.getElementById(id);

$('pull').onclick = () => {
  if (pulling||coins<=0) return;
  pulling=true; coins--;
  $('coins').textContent=coins; $('left').textContent=coins;
  const ssr = Math.random()<P_SSR;
  const rar = ssr?'ssr':(Math.random()<0.3?'r':'n');
  cur = {rar, rab: RAB[Math.floor(Math.random()*RAB.length)]};
  $('ov').style.display='flex';
  $('ov').classList.remove('ssrbg','quake');
  $('flash').className='flash';
  const c=$('circle'), o=$('orb');
  c.className='circle go'; o.className='orb';
  $('card').className='card'; $('card').innerHTML='';
  sndRiser(); sndHeart();
  /* ①魔法陣(紫)→ ②R以上で金 → ③SSRは虹に変色(確定演出) */
  if (rar!=='n') setTimeout(()=>{ c.classList.add('gold'); sndCard(); }, 1400);
  if (ssr) setTimeout(()=>{ c.classList.remove('gold'); c.classList.add('rainbow'); sndRainbow(); }, 2100);
  /* ④玉が落ちる→震え→破裂→カード */
  setTimeout(()=>{ o.classList.add('go'); }, ssr?2800:1900);
  setTimeout(()=>{ o.classList.add('shake'); sndHeart(); }, ssr?3700:2800);
  setTimeout(()=>endPull(false), ssr?4800:3800);
};
function endPull(skipped){
  if (!cur) return;
  const {rar, rab} = cur;
  const isSSR = rar==='ssr';
  /* 閃光: SSR=金の大明滅 / R=青 / N=やわらか */
  $('flash').className = isSSR ? 'flash gold strobe' : ('flash weak ' + (rar==='r'?'blue':'soft'));
  if (isSSR) $('ov').classList.add('ssrbg');
  sndBoom();
  $('circle').className='circle'; $('orb').className='orb';
  const card=$('card');
  if (isSSR){
    /* 大暴れ: 画面が揺れる→SSRの文字がドン→放射光→紙吹雪の嵐 */
    $('ov').classList.add('quake');
    setTimeout(()=>$('ov').classList.remove('quake'), 600);
    const st=$('ssrtext'); st.classList.remove('slam','fadeup');
    void st.offsetWidth;
    st.classList.add('slam');
    setTimeout(()=>st.classList.add('fadeup'), 900);
    $('rays').classList.add('go');
    sndSSR(); sndPekaBass();
    confetti(); setTimeout(confetti, 500); setTimeout(confetti, 1000);
    card.className='card ssr';
    card.innerHTML = `<div class="rar">🌟 S S R 🌟</div>
      <img src="img/バツベイ_アイコン600.png">
      <div class="nm">ばつべーのしんらい</div>
      <a class="tobira-btn" href="#" onclick="alert('本番はここが「とびらページ」へのリンク(素のリンク=石橋仕様)');return false;">とびらのばしょへ ▶</a>
      <div class="note">ブックマークしてね / つぎのドロップまで有効<br>ひらけないときはBASEで「ちびボード」をけんさく</div>`;
    $('msg').innerHTML='🌟SSR!! とびらのばしょを おしえてもらえた!';
    $('pull').disabled=true;
  } else {
    /* ハズレもカードの喜びはちゃんと演出(SSRとの差は「規模」で付ける) */
    $('rays').classList.remove('go');
    if (rar==='r'){ sndR(); } else { sndN(); }
    card.className = 'card ' + rar;
    const flavor = rar==='r'
      ? 'R! ちょっとレアな子🎵'
      : 'うさぎカードをゲット';
    card.innerHTML = `<div class="rar">${rar==='r'?'✨ R ✨':'N'}</div>
      <img src="img/${rab}.png">
      <div class="nm">${NAMES[rab]}</div>
      <div class="note">${flavor}(ずかんの子だよ)</div>`;
    $('msg').innerHTML = `「${NAMES[rab]}」をひいた!` + (coins>0?' のこり'+coins+'回!':' また あした🐰');
    if (coins<=0) $('pull').disabled=true;
  }
  setTimeout(()=>{ card.classList.add('go'); }, 80);
  setTimeout(()=>{ if(rar!=='ssr'){ $('ov').style.display='none'; pulling=false; } else { pulling=false; } }, rar==='ssr'?999999:1800);
  if (rar==='ssr'){ $('ov').addEventListener('click', function h(e){ if(e.target.id==='ov'){ $('ov').style.display='none'; $('ov').removeEventListener('click',h);} }); }
  cur=null;
}
function confetti(){
  const cols=['#e84898','#5fd6c4','#ffd54f','#fff','#9a3ac8'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%5];
    c.style.animationDelay=(Math.random()*0.8)+'s';
    $('ov').appendChild(c);
    setTimeout(()=>c.remove(), 3200);
  }
}
</script>
</body>
</html>
