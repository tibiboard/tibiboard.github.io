<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ちびボード — テストページ</title>
<style>
:root{
  --pink:#e84898; --pink-deep:#e0197a; --pink-pale:#ffe3f0;
  --mint:#5fd6c4; --mint-pale:#d9f4ee; --mint-deep:#1fae99;
  --ink:#3a2233; --dark:#180a14;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--dark);color:#fff;min-height:100vh}

/* ============ 開幕: 電源スイッチ ============ */
#boot{position:fixed;inset:0;background:var(--dark);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#boot.off{opacity:0;pointer-events:none}
#boot .hint{color:#5c4152;font-size:13px;letter-spacing:4px;margin-top:34px;animation:hintblink 3s infinite;text-align:center;padding:0 12px}
@keyframes hintblink{50%{opacity:.25}}
.sw{width:92px;height:150px;border-radius:22px;background:#241521;border:3px solid #3c2233;cursor:pointer;position:relative;box-shadow:inset 0 0 24px #000}
.sw .knob{position:absolute;left:8px;right:8px;bottom:8px;height:62px;border-radius:14px;background:linear-gradient(#4a2c40,#332030);transition:all .18s;box-shadow:0 4px 8px #000}
.sw.on .knob{bottom:76px;background:linear-gradient(var(--pink),var(--pink-deep))}
body.rumble{animation:rumble .5s}
@keyframes rumble{0%,100%{transform:translate(0)}15%{transform:translate(-7px,3px)}30%{transform:translate(6px,-4px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(5px,4px)}75%{transform:translate(-3px,2px)}}
#bootflash{position:fixed;inset:0;background:#fff;opacity:0;z-index:199;pointer-events:none}
#bootflash.go{animation:bfl .9s}
@keyframes bfl{15%{opacity:1}100%{opacity:0}}

/* ============ うさぎドン ============ */
#usagi{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--dark);text-align:center;padding:20px}
#usagi.show{display:flex;animation:appear .4s}
@keyframes appear{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
/* 黒うさぎが黒背景に溶けないよう、光の後光を敷く */
#usagi .halo{position:relative;display:flex;align-items:center;justify-content:center;
  width:min(96vw,88vh);height:min(96vw,88vh);border-radius:50%;
  background:radial-gradient(circle, #fff 0%, #ffe3f0 45%, rgba(255,227,240,.25) 70%, transparent 75%)}
#usagi.nashi .halo{background:radial-gradient(circle, #fff 0%, #dce9ff 45%, rgba(220,233,255,.25) 70%, transparent 75%)}
#usagi img{height:min(76vh,90vw);max-width:92vw;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
#usagi .msg{margin-top:6px}
#usagi .msg{font-size:18px;font-weight:900;margin-top:14px;letter-spacing:2px}
#usagi.ari .msg{color:var(--pink)}
#usagi.nashi .msg{color:#8fb8ff}
#usagi .down{margin-top:30px;color:#8d7f89;font-size:13px;letter-spacing:3px;animation:hintblink 2.2s infinite;cursor:pointer}

/* ============ 棚 ============ */
#shelf-sec{max-width:980px;margin:0 auto;padding:56px 20px 40px}
#shelf-sec h2{font-size:22px;font-weight:900;margin-bottom:6px;display:inline-block;background:var(--pink-deep);color:#fff;padding:4px 18px;border-radius:4px;letter-spacing:3px}
#shelf-sec .sub{font-size:13px;margin:14px 0 24px;color:#c9a9bd}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.item{background:#241a22;border-radius:14px;padding:16px;text-align:center;color:#8d7f89;position:relative;overflow:hidden}
.item .ph{height:70px;display:flex;align-items:center;justify-content:center;font-size:36px;filter:grayscale(1);opacity:.5}
.item .nm{font-weight:900;margin:6px 0 2px;color:#c9bcc5;font-size:14px}
.item .st{font-size:12px}
.item .stamp{position:absolute;top:12px;right:-38px;transform:rotate(35deg);background:var(--mint-deep);color:#fff;font-size:11px;font-weight:900;padding:3px 40px}
.item.live{background:linear-gradient(135deg,var(--pink-pale),#fff);color:var(--ink);box-shadow:0 0 0 3px var(--pink),0 0 26px 4px rgba(232,72,152,.55);animation:glow 1.6s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 3px var(--pink),0 0 18px 2px rgba(232,72,152,.4)}to{box-shadow:0 0 0 3px var(--pink),0 0 30px 8px rgba(232,72,152,.75)}}
.item.live .ph{filter:none;opacity:1}
.item.live .nm{color:var(--pink-deep)}
.item.live .tag{display:inline-block;background:var(--mint);color:var(--ink);font-weight:900;font-size:11px;border-radius:999px;padding:3px 10px;margin-bottom:6px}
.item.live .price{font-weight:900;color:var(--pink-deep);margin:4px 0}
.item.live .go{display:inline-block;margin-top:8px;background:var(--pink);color:#fff;font-weight:900;font-size:12.5px;border-radius:10px;padding:9px 14px;cursor:pointer;border:0;border-bottom:5px solid var(--pink-deep)}
.item.live .go:active{border-bottom-width:2px;transform:translateY(3px)}

/* ============ 先行入場券 ============ */
#ticket-sec{max-width:700px;margin:0 auto;padding:20px 20px 50px;text-align:center}
.ticketbtn{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;border:0;border-bottom:9px solid var(--pink-deep);border-radius:18px;
  padding:26px 30px;font-weight:900;font-size:21px;cursor:pointer;letter-spacing:1px;width:100%;max-width:460px;
  box-shadow:0 0 0 4px #fff2,0 0 30px 6px rgba(232,72,152,.55);animation:ticketpulse 2.2s infinite}
.ticketbtn:active{border-bottom-width:3px;transform:translateY(5px)}
@keyframes ticketpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 4px #fff2,0 0 20px 4px rgba(232,72,152,.45)}50%{transform:scale(1.045);box-shadow:0 0 0 4px #fff3,0 0 42px 10px rgba(232,72,152,.8)}}
#ticket-detail{display:none;margin-top:22px;background:#241521;border:3px solid var(--mint);border-radius:16px;padding:20px;text-align:left}
#ticket-detail.show{display:block;animation:appear .4s}
#ticket-detail .desc{font-size:14px;line-height:1.9;color:#e6d6e0;margin-bottom:18px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.keybtn{display:inline-block;background:#fff;border:3px solid var(--ink);border-bottom-width:8px;border-radius:12px;
  padding:14px 20px;font-weight:900;font-size:14px;color:var(--ink);cursor:pointer;user-select:none;text-decoration:none;text-align:center}
.keybtn:active{border-bottom-width:3px;transform:translateY(5px)}
.keybtn.pink{background:var(--pink);color:#fff;border-color:var(--pink-deep)}
.keybtn.mint{background:var(--mint);border-color:var(--mint-deep)}
.keybtn.disabled{background:#3a3038!important;color:#7a6d76!important;border-color:#4a3f47!important;cursor:not-allowed;pointer-events:none;box-shadow:none}
.testnote{margin-top:16px;font-size:11px;color:#8d7f89;line-height:1.7;text-align:center}

footer{background:var(--pink-deep);color:#fff;text-align:center;padding:26px;font-size:13px;letter-spacing:2px}

#toggle{position:fixed;left:8px;bottom:8px;z-index:250;background:#241521;color:#8d7f89;font-size:10px;
  border:1px solid #3c2233;border-radius:6px;padding:4px 8px;opacity:.6;cursor:pointer}
</style>
</head>
<body>

<div id="bootflash"></div>
<div id="boot">
  <div class="sw" id="sw"><div class="knob"></div></div>
  <div class="hint">— でんげんをいれてください —</div>
</div>

<div id="usagi">
  <div class="halo"><img id="usagiImg" src="" alt="うさぎ"></div>
  <div class="msg" id="usagiMsg"></div>
  <div class="down" onclick="document.getElementById('shelf-sec').scrollIntoView({behavior:'smooth'})">▼ したへ</div>
</div>

<section id="shelf-sec">
  <h2>旅立った子たち</h2>
  <div class="sub">スタンプは旅立ちの日付</div>
  <div class="shelf" id="shelf"></div>
</section>

<section id="ticket-sec">
  <button class="ticketbtn" id="ticketBtn">🎫 次回の先行入場券に ちょうせんする</button>
  <div id="ticket-detail">
    <div class="desc">①きょうぎに かつ → ②そのばで ガチャかスロットを えらんで あたりをひく<br>1にち1かい・むりょう</div>
    <div class="btns">
      <a class="keybtn mint" href="kyogi.html">🏟 きょうぎに ちょうせんする</a>
    </div>
    <div class="testnote">(テスト用: かったつもりで <a href="win.html" style="color:inherit">win.html</a> へ)</div>
  </div>
</section>

<footer>ちびボード工房 — うさぎと、世界にひとつのキーボード。</footer>

<div id="toggle" onclick="toggleArimasu()">切替(テスト用)</div>

<script>
/* テスト用: 在庫あり/なしをここで切替 */
const ARIMASU = true;

function renderUsagi(ari){
  const u = document.getElementById('usagi');
  const img = document.getElementById('usagiImg');
  const msg = document.getElementById('usagiMsg');
  u.classList.remove('ari','nashi');
  if (ari){
    u.classList.add('ari');
    img.src = 'img/heart.svg?v=5';
    msg.textContent = '🌟 いまお店に いるよ!';
  } else {
    u.classList.add('nashi');
    img.src = 'img/cry.svg?v=5';
    msg.textContent = '…みんな旅立ったよ。つぎの子をまっててね';
  }
  renderShelf(ari);
}

const SOLD_ITEMS = [
  {nm:'シカク 1号', date:'2026.8.1'},
  {nm:'マル 1号',   date:'2026.8.1'},
  {nm:'シカク 2号', date:'2026.8.9'},
  {nm:'30Z 1号',    date:'2026.8.9'},
  {nm:'マル 2号',   date:'2026.8.16'},
  {nm:'30Z 2号',    date:'2026.8.16'}
];

function renderShelf(ari){
  const shelf = document.getElementById('shelf');
  let html = '';
  if (ari){
    html += `<div class="item live">
      <div class="tag">🐰 いまここにいます</div>
      <div class="ph">⌨️</div>
      <div class="nm">シカク 3号</div>
      <div class="price">¥35,000</div>
      <button class="go" onclick="alert('本番はここからBASEの購入ページへ飛びます')">むかえにいく ▶</button>
    </div>`;
  }
  SOLD_ITEMS.forEach(it=>{
    html += `<div class="item"><div class="stamp">${it.date}</div><div class="ph">⌨️</div><div class="nm">${it.nm}</div><div class="st">SOLD OUT</div></div>`;
  });
  shelf.innerHTML = html;
}

let ariCur = ARIMASU;
renderUsagi(ariCur);
function toggleArimasu(){
  ariCur = !ariCur;
  renderUsagi(ariCur);
}

document.getElementById('sw').onclick = function(){
  this.classList.add('on');
  setTimeout(()=>{
    document.body.classList.add('rumble');
    if(navigator.vibrate) navigator.vibrate([80,40,120]);
  }, 200);
  setTimeout(()=>{
    document.getElementById('bootflash').classList.add('go');
    document.getElementById('boot').classList.add('off');
  }, 800);
  setTimeout(()=>{
    document.getElementById('usagi').classList.add('show');
  }, 1100);
};

document.getElementById('ticketBtn').onclick = function(){
  document.getElementById('ticket-detail').classList.toggle('show');
};

</script>
</body>
</html>
