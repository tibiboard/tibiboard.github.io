<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ちびスロット — ばつべーをそろえろ!</title>
<script src="asobi_common.js"></script>
<style>
:root{--pink:#e84898;--pink-deep:#e0197a;--mint:#5fd6c4;--gold:#ffd54f;--gold-deep:#c99a1e;--ink:#3a2233}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;background:#180a14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;user-select:none}
h1{font-size:40px;letter-spacing:6px;color:var(--mint);margin:6px 0 2px}
.fuda{background:#fff;color:var(--ink);border-radius:18px;padding:14px 30px;font-size:24px;font-weight:900;line-height:2.1;margin:10px 0;border-left:6px solid var(--mint);text-align:center}
.fuda b{color:var(--pink-deep);font-size:30px}
.coin{font-size:48px;font-weight:900;margin:8px 0;background:#3a2233;border-radius:999px;padding:10px 34px;color:var(--gold);letter-spacing:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}

/* ===== 台(大型) ===== */
.machine{position:relative;background:linear-gradient(#4a2438,#2a1322);border:6px solid var(--gold);border-radius:26px;padding:20px 22px 24px;margin:8px 0;box-shadow:0 10px 0 rgba(0,0,0,.5), 0 0 40px rgba(255,213,79,.15), inset 0 2px 8px rgba(255,255,255,.15);max-width:880px;width:100%}
/* 屋根の電飾 */
.marquee{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.bulb{width:22px;height:22px;border-radius:50%;background:#5a4030;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
.machine.excited .bulb, .bulb.on{background:var(--gold);box-shadow:0 0 12px 3px rgba(255,213,79,.8)}
.title-plate{text-align:center;font-weight:900;letter-spacing:10px;font-size:26px;color:var(--gold);text-shadow:0 2px 0 #000;margin-bottom:12px}

/* リール窓 */
.window{background:#0d060b;border:5px solid var(--gold-deep);border-radius:16px;padding:14px;display:flex;gap:12px;justify-content:center;box-shadow:inset 0 6px 18px rgba(0,0,0,.9)}
.reel{width:200px;height:250px;background:linear-gradient(#fff,#e8e4ea 50%,#cfc8d4);border-radius:10px;overflow:hidden;position:relative;border:3px solid #b8b0be}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:56px;z-index:3;pointer-events:none}
.reel::before{top:0;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.strip{position:absolute;left:0;top:0;width:100%}
.strip img{display:block;width:170px;height:170px;object-fit:contain;margin:40px auto}
.reel.spin .strip{animation:roll .38s linear infinite}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-250px)}}
.reel.stopbounce .strip{animation:bounce .32s ease-out}
@keyframes bounce{0%{transform:translateY(-18px)}55%{transform:translateY(8px)}100%{transform:translateY(0)}}
/* 当たりライン */
.payline{position:absolute;left:8px;right:8px;top:50%;height:3px;background:rgba(232,72,152,.55);border-radius:2px;z-index:4;pointer-events:none;transform:translateY(-50%)}
.machine.excited .payline{background:var(--gold);box-shadow:0 0 14px 3px rgba(255,213,79,.9)}

/* レバー(見た瞬間「これを引くんだ」と分かる大きさ) */
.body-row{display:flex;align-items:stretch;gap:16px}
.win-wrap{flex:1;position:relative}
.lever-rail{width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.lever{width:42px;height:240px;background:linear-gradient(#ffe9a3,#c99a1e);border-radius:14px;position:relative;cursor:pointer;transition:transform .12s;transform-origin:bottom center;box-shadow:0 3px 6px rgba(0,0,0,.5);animation:leverinvite 1.3s ease-in-out infinite}
@keyframes leverinvite{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.lever .ball{position:absolute;top:-62px;left:50%;transform:translateX(-50%);width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 34% 30%, #ff9ec2, var(--pink-deep));box-shadow:0 6px 12px rgba(0,0,0,.7), inset 0 3px 9px rgba(255,255,255,.6), 0 0 0 0 rgba(232,72,152,.7);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;letter-spacing:1px;animation:ballglow 1.3s ease-in-out infinite}
@keyframes ballglow{0%,100%{box-shadow:0 6px 12px rgba(0,0,0,.7), inset 0 3px 9px rgba(255,255,255,.6), 0 0 0 0 rgba(232,72,152,.7)}50%{box-shadow:0 6px 12px rgba(0,0,0,.7), inset 0 3px 9px rgba(255,255,255,.6), 0 0 0 14px rgba(232,72,152,0)}}
/* 👉で視線誘導(引ける時だけ) */
.lever-rail::before{content:"👉";position:absolute;top:0px;left:-84px;font-size:64px;z-index:5;animation:pointat 0.9s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
@keyframes pointat{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.lever-rail:has(.lever.disabled)::before,.lever-rail:has(.lever.pulled)::before{display:none}
.lever-rail .base{width:100px;height:40px;background:#3a2233;border-radius:10px 10px 5px 5px;margin-top:6px;border:2px solid #5a4030}
.lever.pulled{animation:none;transform:scaleY(.5) translateY(60px)}
.lever.pulled .ball{animation:none}
.lever.disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed;animation:none}
.lever.disabled .ball{animation:none}
.lever-label{display:none}
/* 🪙が無い時にレバーを触ったら、コインの入手先をピカッと知らせる */
#msg.nudge{animation:msgnudge .8s ease-in-out 3}
@keyframes msgnudge{0%,100%{transform:scale(1)}50%{transform:scale(1.18);color:var(--gold)}}

#msg{min-height:3.4em;text-align:center;font-weight:900;font-size:23px;margin-top:16px;line-height:1.8;max-width:760px}
#msg .big{font-size:38px;color:var(--gold)}
#msg a{color:var(--mint)}
#tobira{display:none;background:var(--mint);color:var(--ink);border-radius:14px;padding:14px 20px;margin-top:10px;text-align:center;font-weight:900;max-width:460px}
#tobira a{display:inline-block;background:var(--pink);color:#fff;border-radius:10px;padding:12px 26px;text-decoration:none;margin-top:8px;border-bottom:5px solid var(--pink-deep)}
#tobira .note{font-size:11px;font-weight:700;margin-top:8px;color:#0d4a41}
.getcard{display:none;background:#fff;color:var(--ink);border-radius:14px;padding:12px 18px;margin-top:10px;text-align:center;font-weight:900}
.getcard img{width:90px;display:block;margin:6px auto}
.links{margin-top:16px;font-size:12px;color:#8d7f89}
.links a{color:#8d7f89}
/* 大当たり紙吹雪 */
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:50;animation:conf 2.6s linear forwards;pointer-events:none}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}
/* 大当たりの画面全体フラッシュ(3連) */
#flashfx{position:fixed;inset:0;background:#fff;z-index:80;pointer-events:none;opacity:0;animation:ffx 1.3s}
@keyframes ffx{6%{opacity:1}14%{opacity:0}22%{opacity:.9}32%{opacity:0}42%{opacity:.7}60%{opacity:0}}
/* 消灯演出 */
#dark{position:fixed;inset:0;background:#000;z-index:70;opacity:0;pointer-events:none;transition:opacity .12s}
#dark.on{opacity:1}
/* 魚群演出 */
.gyogun{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.gyogun img{position:absolute;animation:gyorun 1.7s linear forwards}
@keyframes gyorun{from{transform:translateX(110vw)}to{transform:translateX(-140px)}}
/* カットイン演出 */
.cutin{position:fixed;left:50%;top:50%;width:min(70vw,420px);z-index:66;pointer-events:none;
  transform:translate(-50%,-50%) scale(.2);filter:drop-shadow(0 0 40px rgba(255,213,79,.9));
  animation:cutinpop 1.05s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes cutinpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
/* 演出のひみつ(確率表) */
#fxbtn{background:#3a2233;color:#ffd54f;border:3px solid #5a4030;border-radius:999px;padding:12px 32px;font-weight:900;font-size:22px;cursor:pointer;font-family:inherit;margin-top:4px}
#fxov{position:fixed;inset:0;background:rgba(13,6,11,.85);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#fxov.show{display:flex}
.fxbox{background:#fff;color:var(--ink);border:6px solid var(--gold);border-radius:28px;padding:34px 40px;max-width:720px;width:100%;font-weight:900}
.fxbox h3{color:#8a6a10;letter-spacing:4px;font-size:32px;text-align:center;margin-bottom:18px}
.fxbox .row{display:flex;justify-content:space-between;border-bottom:3px solid #f0e8d0;padding:15px 4px;font-size:25px}
.fxbox .row b{color:var(--pink-deep)}
.fxbox .foot{font-size:19px;margin-top:16px;color:#5a4a30;text-align:center;font-weight:700}

/* 🪙0枚の絵で伝える(文字なし) */
.coin.empty{filter:grayscale(1);opacity:.75;position:relative}
.coin.empty::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff3b5c;font-size:64px;text-shadow:0 0 10px rgba(0,0,0,.6);pointer-events:none}
#nocoin{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none}
#nocoin.go{display:flex}
#nocoin .stamp{position:relative;font-size:190px;line-height:1;animation:ncpop .9s cubic-bezier(.2,1.6,.4,1)}
#nocoin .stamp .c{filter:grayscale(1)}
#nocoin .stamp::after{content:"✖";position:absolute;inset:-30px;display:flex;align-items:center;justify-content:center;color:#ff3b5c;font-size:250px;font-weight:900;text-shadow:0 0 24px rgba(0,0,0,.8)}
@keyframes ncpop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.25);opacity:1}45%{transform:scale(1)}60%{transform:translateX(-14px)}70%{transform:translateX(12px)}80%{transform:translateX(-8px)}90%{transform:translateX(6px)}100%{transform:translateX(0)}}

/* ===== クリィミーマミ差し色(2026-08-15)。舞台の闇はそのまま、差し色だけパステルに。旧値: pink#e84898/deep#e0197a/mint#5fd6c4/gold#ffd54f ===== */
:root{
  --pink:#f096bd; --pink-deep:#d873a5;
  --mint:#a8e0cc; --gold:#f2d98a; --gold-deep:#d9b95e;
}

/* 👉指差しをマミ色に(2026-08-15) */
.lever-rail::before, .body2::before{filter:sepia(1) saturate(2.2) hue-rotate(295deg) brightness(1.08) drop-shadow(0 3px 5px rgba(0,0,0,.4)) !important}
</style>
</head>
<body>
<div id="nocoin"><div class="stamp"><span class="c">🪙</span></div></div>

<h1>🎰 ちびスロット</h1>
<div class="fuda">
<img src="img/バツベイ_アイコン800.png" style="width:34px;vertical-align:middle"> ×3 そろえたら <b>大あたり</b> 🎁たからばこ!
<br><span style="font-size:15px;opacity:.85">🎁たからばこは 1しゅうかんに 1こまで</span>
</div>

<div class="coin" id="status">🪙</div>
<button id="fxbtn">❔ 演出のひみつ</button>

<div id="fxov"><div class="fxbox">
  <h3>— 演出のひみつ —</h3>
  <div class="row"><span>✨ キュイン!(高い音)</span><b>🎁 1/5</b></div>
  <div class="row"><span>🐰 ばつべーの大群が よこぎる</span><b>🎁 1/4</b></div>
  <div class="row"><span>🐢 レバーをひいても うごかない</span><b>🎁 1/3</b></div>
  <div class="row"><span>💥 ばつべーが ドーンと出る</span><b>🎁 1/2</b></div>
  <div class="row"><span>⬛ とつぜん まっくら</span><b>🎁 2/3</b></div>
  <div class="foot">演出が出たら <b>大あたり かくてい</b>🐰<br>演出なしでも そろえば あたり<br>🎁たからばこは 1しゅうかんに 1こまで</div>
</div></div>

<div class="machine" id="machine">
  <div class="marquee" id="marquee"></div>
  <div class="title-plate">— BATSUBEI SLOT —</div>
  <div class="body-row">
    <div class="win-wrap">
      <div class="window">
        <div class="reel" id="r0"><div class="strip"></div><div class="payline"></div></div>
        <div class="reel" id="r1"><div class="strip"></div><div class="payline"></div></div>
        <div class="reel" id="r2"><div class="strip"></div><div class="payline"></div></div>
      </div>
    </div>
    <div class="lever-rail">
      <div class="lever" id="lever"><div class="ball">ひく!</div></div>
      <div class="base"></div>
      <div class="lever-label">ひっぱる</div>
    </div>
  </div>
</div>

<div id="msg"></div>
<div id="tobira">🎉 大あたり!!
  <div style="font-size:14px;font-weight:900;margin-top:8px">たからばこが とどいたよ!</div>
  <button id="openchest" style="margin-top:10px;background:#e84898;color:#fff;border:0;border-bottom:6px solid #e0197a;border-radius:12px;padding:12px 26px;font-weight:900;font-size:20px;cursor:pointer;font-family:inherit">🎁 たからばこを あける ▶</button>
</div>
<div id="dark"></div>
<div class="links"><a href="shop/index.html?in=1">お店にもどる</a> / <a href="shop/うさぎのへや.html">うさぎ図鑑</a></div>

<script>
/* ============================================================
   絵柄: 標準ばつべー(=大当たりシンボル)+へんそうばつべー8種
   ⚠当たり判定はいずれCloudflare Workers(サーバー側)へ移す。
   　この版は演出確認用のモック(確率はC.drawPriorityに従う)
   ============================================================ */
const STD = {id:'std', src:'img/バツベイ_アイコン800.png'};
const VARIANTS = [
  {id:'cute_01', src:'img/usagi/cute_01.png'},
  {id:'cute_04', src:'img/usagi/cute_04.png'},
  {id:'cute_20', src:'img/usagi/cute_20.png'},
  {id:'edgy_19', src:'img/usagi/edgy_19.png'},
  {id:'street_02', src:'img/usagi/street_02.png'},
  {id:'street_05', src:'img/usagi/street_05.png'},
  {id:'street_15', src:'img/usagi/street_15.png'}
];
const ALL = [STD, ...VARIANTS];
/* 小当たりは廃止(2026-08-14〜)。ずかん入手経路は🎁宝箱だけ */

/* ===== 音(体験版から移植。全部Web Audio自作=著作権クリーン) ===== */
let AC, MASTER;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-28; comp.knee.value=8; comp.ratio.value=14;
  comp.attack.value=0.008; comp.release.value=0.18;
  MASTER=AC.createGain(); MASTER.gain.value=1.6; MASTER.connect(comp); comp.connect(AC.destination);} return AC; }
function out(){ ac(); return MASTER; }
function tone(freq,t0,dur,type='square',gain=0.15,slide=0){ const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,a.currentTime+t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+t0+dur);
  g.gain.setValueAtTime(gain,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  o.connect(g); g.connect(out()); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+dur+0.05); }
function knock(t0,dur,freq,gain){ const a=ac(),len=a.sampleRate*dur,buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=2.5;
  const g=a.createGain(); g.gain.setValueAtTime(gain,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  s.connect(f); f.connect(g); g.connect(out()); s.start(a.currentTime+t0); }
function bomb(){ const a=ac(); const bg=a.createGain(); bg.gain.value=2.8; bg.connect(a.destination);
  const len=a.sampleRate*0.06,buf=a.createBuffer(1,len,a.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,0.5);
  const s=a.createBufferSource(); s.buffer=buf; const ng=a.createGain(); ng.gain.value=1.6; s.connect(ng); ng.connect(bg); s.start();
  [26,29,32,35,38,42,46,50,55,60].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f*2.2,a.currentTime); o.frequency.exponentialRampToValueAtTime(f,a.currentTime+0.08);
    g.gain.setValueAtTime(1.0,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+1.1-i*0.04);
    o.connect(g); g.connect(bg); o.start(); o.stop(a.currentTime+1.2); });
  [70,80,90,100,115,130].forEach(f=>{ const o=a.createOscillator(),g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f*1.8,a.currentTime); o.frequency.exponentialRampToValueAtTime(f*0.7,a.currentTime+0.25);
    g.gain.setValueAtTime(0.9,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.4);
    o.connect(g); g.connect(bg); o.start(); o.stop(a.currentTime+0.5); }); }
function sndLever(){ tone(180,0,0.08,'square',0.2); tone(90,0,0.1,'sawtooth',0.15) }
function sndStop(){ tone(320,0,0.06,'square',0.18); knock(0,0.08,300,0.6) }
function sndBig(){ bomb();
  [34,37,40,43,46,50,54,58,63,68].forEach((f,i)=>tone(f,0,0.9-i*0.03,'sine',0.55,f*0.82));
  knock(0,0.25,240,1.4); knock(0,0.22,520,1.4);
  [1109,1333,1479,1733,1976,2217,2489,2794].forEach((f,i)=>tone(f,0.015,0.8-i*0.05,'triangle',0.22-i*0.015));
  [4186,4699,5274,5920].forEach((f,i)=>tone(f,0.05+i*0.03,0.5,'sine',0.08)); }
/* 小当たり=これまでの大当たり級の「ドカーン」(気持ちいい音は惜しまない) */
function sndSmall(){ sndBig(); }
/* 大当たり=音を重ねてさらに轟かせる: ドカーン2連+超重低音の追い打ち */
function sndJackpot(){
  sndBig();
  setTimeout(()=>{ bomb(); [28,31,34,38,42].forEach((f,i)=>tone(f,0,1.4-i*0.05,'sine',0.6,f*0.85)); }, 260);
  setTimeout(()=>{ knock(0,0.35,300,1.5); [1976,2489,2960].forEach((f,i)=>tone(f,0,1.2,'triangle',0.14-i*0.03)); }, 550);
}
function sndMiss(){ tone(220,0,0.15,'sine',0.12,180) }
/* キュイン!: 沖スロ風の短く鋭い高音(シンプル・一発) */
function sndKyuin(){
  tone(1500,0,0.22,'square',0.3,4800);
  tone(2200,0.02,0.16,'sine',0.16,5600);
}
/* 消灯からの復帰「ドンッ」 */
function sndRelight(){ knock(0,0.2,300,1.2); [60,80,110].forEach(f=>tone(f,0,0.3,'sine',0.5,45)); }
/* 魚群のヒュオオオ(ノイズの下降スイープ) */
function sndGyogun(){
  const a=ac(),len=a.sampleRate*1.2,buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len)*0.7;
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=3;
  f.frequency.setValueAtTime(2400,a.currentTime); f.frequency.exponentialRampToValueAtTime(400,a.currentTime+1.1);
  const g=a.createGain(); g.gain.value=0.9; s.connect(f); f.connect(g); g.connect(out()); s.start();
}
/* カットインのドーン */
function sndCutin(){ knock(0,0.25,260,1.5); [70,90,120].forEach(f=>tone(f,0,0.35,'sine',0.6,48)); tone(1976,0.05,0.7,'triangle',0.12); }
/* 魚群: ばつべーの大群が横断 */
function runGyogun(){
  sndGyogun();
  const box=document.createElement('div'); box.className='gyogun'; document.body.appendChild(box);
  for(let i=0;i<22;i++){
    const img=document.createElement('img');
    img.src=ALL[i%ALL.length].src;
    img.style.top=(8+Math.random()*80)+'vh';
    img.style.animationDelay=(Math.random()*0.5)+'s';
    img.style.width=(46+Math.random()*40)+'px';
    box.appendChild(img);
  }
  setTimeout(()=>box.remove(), 2600);
}
/* カットイン: ばつべーがドーンと出て消える */
function runCutin(){
  sndCutin();
  const img=document.createElement('img'); img.className='cutin';
  img.src=ALL[Math.floor(Math.random()*ALL.length)].src;
  document.body.appendChild(img);
  setTimeout(()=>img.remove(), 1100);
}
/* 大当たりの画面全体フラッシュ */
function screenFlash(){
  const f=document.createElement('div'); f.id='flashfx'; document.body.appendChild(f);
  setTimeout(()=>f.remove(), 1400);
}

/* ===== 台の準備 ===== */
const $ = id => document.getElementById(id);
const C = window.CHIBI;
const nameOf = id => { const [s,n]=id.split('_'); return (C&&C.seriesJa&&C.seriesJa[s]? C.seriesJa[s]+' No.'+n : 'ばつべー'); };
/* 演出のひみつ(確率表)ポップアップ */
document.getElementById('fxbtn').onclick=()=>document.getElementById('fxov').classList.add('show');
document.getElementById('fxov').onclick=e=>{ if(e.target.id==='fxov') e.currentTarget.classList.remove('show'); };
/* 電飾 */
for(let i=0;i<9;i++){ const b=document.createElement('div'); b.className='bulb'; $('marquee').appendChild(b); }
setInterval(()=>{ const bs=[...document.querySelectorAll('.bulb')];
  bs.forEach((b,i)=>b.classList.toggle('on', (i+Math.floor(Date.now()/400))%3===0)); },400);
/* リール帯: 全絵柄を縦に並べたループ帯 */
function buildStrip(el){ el.innerHTML=''; const seq=[...ALL,...ALL].sort(()=>Math.random()-.5);
  seq.concat(seq.slice(0,2)).forEach(sym=>{ const img=document.createElement('img'); img.src=sym.src; img.dataset.id=sym.id; el.appendChild(img); }); }
['r0','r1','r2'].forEach(id=>buildStrip($(id).querySelector('.strip')));
function showSymbol(reelId, sym){ const strip=$(reelId).querySelector('.strip');
  strip.innerHTML=''; const img=document.createElement('img'); img.src=sym.src; strip.appendChild(img); strip.style.transform='translateY(0)'; }

let spinning=false;
function refresh(){
  if(!C){ $('status').textContent='🪙 —'; return; }
  $('status').textContent = '🪙 × ' + C.getCoins(); $('status').classList.toggle('empty', C.getCoins()<1);
  const dead = spinning || C.getCoins()<1;
  $('lever').classList.toggle('disabled', dead);
  if(!spinning && C.getCoins()<1) $('msg').innerHTML='<a href="うさぎ探し体験版.html">🔍うさぎ探し</a> か <a href="はしればつべー.html">🏃はしれ!ばつべー</a> で 🪙をゲット';
}
refresh();

$('lever').onclick = ()=>{
  if(spinning) return;
  if(C && C.getCoins()<1){
    refresh();
    const nc=document.getElementById('nocoin'); nc.classList.remove('go'); void nc.offsetWidth; nc.classList.add('go'); setTimeout(()=>nc.classList.remove('go'),1300);
    return;
  }
  spinning=true;
  if(C){ C.spendCoin(); }
  $('machine').classList.remove('excited');
  $('tobira').style.display='none';
  $('lever').classList.add('pulled'); setTimeout(()=>$('lever').classList.remove('pulled'),300);
  sndLever();

  /* --- 抽選(モック。本番はWorkersの結果を受け取るだけにする): 大当たり(1/100)のみ。それ以外はハズレ --- */
  const big = C ? C.drawPriority() : (Math.random()<0.01);

  /* --- 予告演出: 出たら大当たり確定。🎁率は演出ごとに違う(❔ボタンの表と一致させること) --- */
  const FX=[
    {id:'kyuin',   w:.35, r:1/5},   /* ✨ 短い高音 */
    {id:'gyogun',  w:.25, r:1/4},   /* 🐰 ばつべーの大群が横断(魚群) */
    {id:'delay',   w:.20, r:1/3},   /* 🐢 レバー無反応 */
    {id:'cutin',   w:.12, r:1/2},   /* 💥 ばつべーがドーンとカットイン */
    {id:'blackout',w:.08, r:2/3}    /* ⬛ 消灯 */
  ];
  let fx=null;
  if(big){ let t=Math.random(); for(const e of FX){ if((t-=e.w)<0){ fx=e; break; } } fx=fx||FX[0]; }
  let finals;
  if(big) finals=[STD,STD,STD];
  else {
    /* はずれ目: 3つ揃いに絶対ならない組み合わせ。2割で「標準・標準・×」のリーチ */
    if(Math.random()<0.2){ finals=[STD,STD,VARIANTS[Math.floor(Math.random()*VARIANTS.length)]]; }
    else { const a=()=>ALL[Math.floor(Math.random()*ALL.length)]; finals=[a(),a(),a()];
      if(finals[0].id===finals[1].id && finals[1].id===finals[2].id) finals[2]=(finals[0].id==='std'?VARIANTS[0]:STD); }
  }

  const reels=['r0','r1','r2'];
  /* レバー遅延演出: 引いてもリールがしばらく動かない(無音の間=違和感がアツい) */
  const delay0 = (fx && fx.id==='delay') ? 1400 : 0;
  setTimeout(()=>{
    reels.forEach(id=>{ buildStrip($(id).querySelector('.strip')); $(id).classList.add('spin'); });
    if(delay0) sndLever();
  }, delay0);
  /* キュイン演出: 回転が始まって少ししてから短く鋭く */
  if(fx && fx.id==='kyuin'){ setTimeout(()=>{ sndKyuin(); $('machine').classList.add('excited'); }, delay0+600); }
  /* 魚群演出: ばつべーの大群が画面を横断 */
  if(fx && fx.id==='gyogun'){ setTimeout(()=>{ runGyogun(); }, delay0+1500); }
  /* カットイン演出: ばつべーがドーンと画面に出る */
  if(fx && fx.id==='cutin'){ setTimeout(()=>{ runCutin(); }, delay0+1800); }
  /* 消灯演出: 回転中にとつぜん真っ暗→ドンッと復帰 */
  if(fx && fx.id==='blackout'){
    setTimeout(()=>{ document.getElementById('dark').classList.add('on'); }, delay0+2000);
    setTimeout(()=>{ document.getElementById('dark').classList.remove('on'); sndRelight(); $('machine').classList.add('excited'); }, delay0+2900);
  }
  /* リールはたっぷり回す(レバー→全停止で約5秒。リーチはさらに引っぱる) */
  const reach = finals[0].id===finals[1].id;
  const times = [2200, 3500, reach? 6200 : 4800].map(t=>t+delay0);
  times.forEach((t,i)=>setTimeout(()=>{
    const r=$(reels[i]); r.classList.remove('spin');
    showSymbol(reels[i], finals[i]);
    r.classList.add('stopbounce'); setTimeout(()=>r.classList.remove('stopbounce'),350);
    sndStop();
    if(reach && i===1){ $('machine').classList.add('excited'); }
    if(i===2) setTimeout(judge, 300);
  }, t));

  function judge(){
    spinning=false;
    if(big){
      $('machine').classList.add('excited');
      sndJackpot(); screenFlash(); confetti();
      /* 2026-08-14〜: 大当たり=🎁宝箱3択へ。鍵の自動発行はしない(鍵は手配りのみ) */
      $('msg').innerHTML='<span class="big">🎉 大あたり!!</span>';
      $('tobira').style.display='block';
    } else {
      sndMiss();
      $('msg').innerHTML='ざんねん…!';
    }
    refresh();
  }
};
document.getElementById('openchest').onclick = ()=>{
  $('tobira').style.display='none';
  C.showTreasurePicker({ onPick:()=>sndKyuin(), onReveal:()=>sndBig() });
};
function confetti(){ const cols=['#e84898','#5fd6c4','#ffd54f','#fff'];
  for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%4]; c.style.animationDelay=(Math.random()*0.7)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3600); } }
</script>
