<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Z1決定版(接続ゲート式ジッパー)</title>
<style>
  :root{--mint:#bfe9e2;--mint2:#dff5f1;--choco:#5e3e2d;--choco2:#7a5236;--choco3:#4a3123;
        --pink:#f06ba0;--pink2:#ffb3d1;--pink3:#c94f83;--gray:#9a9aa6;--gray2:#e9e9ef;--gray3:#6d6d78;--ash:#f4f2f6}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif}
  .home{position:fixed;inset:0;background:
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(255,255,255,.20) 46px 48px),
      var(--mint2)}
  .home .collar{position:absolute;top:-90px;left:50%;width:460px;height:170px;margin-left:-230px;
    border-radius:0 0 230px 230px;background:var(--mint2);border:14px solid var(--pink2);border-top:0;
    box-shadow:0 8px 14px rgba(0,0,0,.06)}
  .home .print{position:absolute;top:24%;left:0;right:0;text-align:center;
    font-size:min(12vw,84px);font-weight:900;color:var(--choco);letter-spacing:2px;
    text-shadow:3px 3px 0 var(--pink2)}
  .home .stitch{position:absolute;top:0;bottom:0;width:0;border-left:3px dashed rgba(94,62,45,.15)}
  .home .stitch.sl{left:6%}
  .home .stitch.sr{right:6%}
  .hint{position:fixed;right:14px;bottom:10px;z-index:99;font-size:16px;color:#777;background:#fff9;padding:5px 10px;border-radius:8px}

  .st{position:fixed;inset:0}
  .earwin{position:absolute;inset:0;z-index:6;pointer-events:none}

  /* ===== ばつべー: 左の布のかげから耳の先だけ、ななめににゅっ =====
     位置は「画面中央から固定px」で決める(画面サイズ・縦横比に依存しない) */
  .usagi{position:absolute;left:50%;top:120vh;margin-left:-390px;width:780px;z-index:6;
    transform:rotate(-10deg);clip-path:inset(0 0 70% 0);
    transition:top .8s cubic-bezier(.3,1.35,.5,1), margin-left .7s ease, transform .7s ease, width .6s ease, clip-path .6s ease}
  .usagi img{width:100%;display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28))}
  /* 半開き: 画像の上端(=耳の先)が、中央スリットの上部(画面中央から上220px)に刺さる */
  .st.half .usagi{top:120vh}
  @keyframes muku{0%,100%{transform:rotate(-10deg) translate(0,0)}50%{transform:rotate(-6deg) translate(4px,-18px)}}
  .st.open .usagi{width:340px;margin-left:-170px;top:calc(100% - 360px);transform:rotate(0);clip-path:inset(0 0 0% 0)}
  .st.open .usagi img{animation:landb .9s cubic-bezier(.3,1.5,.5,1)}
  @keyframes landb{0%{transform:translateY(60px)}55%{transform:translateY(-26px)}78%{transform:translateY(8px)}100%{transform:translateY(0)}}

  /* ===== 布: 1枚もの(隙間ゼロ)。clip-pathの曲線で「はだけ」を作る ===== */
  .cloth{position:absolute;top:-4%;bottom:-4%;width:60%;z-index:5;
    background:
      radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.10), transparent 60%),
      repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.13) 34px 35.5px),
      var(--choco2);
    transition:clip-path 1.05s cubic-bezier(.65,0,.35,1), transform 1.05s cubic-bezier(.65,0,.35,1)}
  .cloth.l{left:-4%;transform-origin:100% 104%;
    clip-path:polygon(0 0,100% 0,100% 12%,100% 26%,100% 42%,100% 60%,100% 80%,100% 100%,0 100%)}
  .cloth.r{right:-4%;transform-origin:0% 104%;
    clip-path:polygon(100% 0,0 0,0 12%,0 26%,0 42%,0 60%,0 80%,0 100%,100% 100%)}
  /* 半開き: スライダー(42%)より上だけ、ふくらんだ曲線でめくれる */
  .st.half .cloth.l{clip-path:polygon(0 0,63% 0,70% 12%,79% 26%,90% 40%,96% 60%,96% 80%,96% 100%,0 100%);transform:rotate(-2.6deg)}
  .st.half .cloth.r{clip-path:polygon(100% 0,37% 0,30% 12%,21% 26%,10% 40%,4% 60%,4% 80%,4% 100%,100% 100%);transform:rotate(2.6deg)}
  /* 全開: 下を支点に、曲線のまま大きくはだける(布のたわみ) */
  .st.open .cloth.l{clip-path:polygon(0 0,84% 0,89% 12%,94% 26%,99.4% 40%,100% 60%,100% 80%,100% 100%,0 100%);transform:rotate(-20deg) translateX(-78%)}
  .st.open .cloth.r{clip-path:polygon(100% 0,16% 0,11% 12%,6% 26%,0.6% 40%,0 60%,0 80%,0 100%,100% 100%);transform:rotate(20deg) translateX(78%)}

  /* ===== ジッパーテープ(ミントの歯つき)= 布の端に沿って動く =====
     各サイド: 上セグメント(めくれに合わせて傾く)+下セグメント(閉じたまま中央) */
  .tape{position:absolute;width:20px;z-index:6;pointer-events:none;
    background:
      repeating-linear-gradient(180deg, #d9f3ee 0 11px, var(--mint) 11px 20px, var(--choco3) 20px 25px),
      var(--choco3);
    box-shadow:0 0 5px rgba(0,0,0,.28);
    transition:transform 1.05s cubic-bezier(.65,0,.35,1), opacity .35s}
  .tape.tl-up{left:calc(50% - 20px);top:-3%;height:46%;transform-origin:100% 100%}
  .tape.tr-up{left:50%;top:-3%;height:46%;transform-origin:0% 100%}
  .tape.tl-dn{left:calc(50% - 20px);top:42.5%;height:62%}
  .tape.tr-dn{left:50%;top:42.5%;height:62%}
  .st.half .tape.tl-up{transform:rotate(-17deg);border-radius:0 0 6px 6px}
  .st.half .tape.tr-up{transform:rotate(17deg);border-radius:0 0 6px 6px}
  .st.open .tape.tl-up{transform:rotate(-20deg) translateX(-120%);opacity:0;transition-delay:0s,.1s}
  .st.open .tape.tr-up{transform:rotate(20deg) translateX(120%);opacity:0;transition-delay:0s,.1s}
  .st.open .tape.tl-dn{transform:translateX(-200%);opacity:0;transition-delay:0s,.1s}
  .st.open .tape.tr-dn{transform:translateX(200%);opacity:0;transition-delay:0s,.1s}

  /* ===== スライダー ===== */
  .zslider{position:absolute;left:50%;width:70px;margin-left:-35px;z-index:7;top:-110px;
    filter:drop-shadow(0 5px 6px rgba(0,0,0,.28));transition:top 1.15s cubic-bezier(.65,0,.35,1)}
  .st.half .zslider{top:42%}
  .st.open .zslider{top:106%;transition-duration:.8s}
  .zs-crown{width:36px;height:10px;margin:0 auto;background:linear-gradient(var(--gray2),var(--gray));border:3px solid var(--gray3);border-bottom:0;border-radius:8px 8px 0 0}
  .zs-body{position:relative;width:56px;height:46px;margin:0 auto;border:3px solid var(--gray3);border-radius:10px 10px 24px 24px;
    background:linear-gradient(180deg,#f5f5fa,var(--gray2) 35%,var(--gray))}
  .zs-body::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:13px;margin-left:-6.5px;border-radius:6px;
    background:linear-gradient(180deg,#7d7d88,#5a5a64);box-shadow:inset 0 0 4px #000a}
  .zs-body::after{content:"";position:absolute;left:7px;top:6px;width:10px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#cfcfd8)}
  .zs-hinge{width:13px;height:9px;margin:-2px auto 0;background:var(--gray3);border-radius:0 0 4px 4px}
  .zs-pull{width:27px;height:46px;margin:0 auto;border:3px solid var(--pink3);border-radius:13px;
    background:linear-gradient(160deg,#ffd3e6,var(--pink2) 40%,var(--pink));position:relative;
    transform-origin:top center;animation:sway 1.15s ease-in-out infinite}
  .zs-pull::before{content:"";position:absolute;left:50%;top:16px;width:13px;height:17px;margin-left:-6.5px;border-radius:7px;
    background:var(--ash);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
  @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}

  /* ===== 原本の耳(batsubei600.pngの耳部分を切り出し)+ぶら下がりタグ ===== */
  .earsout{position:absolute;left:50%;top:41.5%;width:900px;height:0;margin-left:-450px;display:none}
  .st.half .earsout{display:block}
  .earclip{position:absolute;left:0;top:0;width:900px;height:0;z-index:4}
  .st.half .earwrap{transform-origin:450px 0;
    animation:earsRise .8s cubic-bezier(.3,1.3,.5,1), earsSway 2.4s ease-in-out .8s infinite}
  @keyframes earsRise{from{transform:translate(20px,190px) rotate(-2deg)}to{transform:translate(0,0) rotate(-10deg)}}
  @keyframes earsSway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-4deg)}}
  .earimg{position:absolute;left:140px;top:-320px;width:620px;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));pointer-events:none}
  .tag{position:absolute;border:0;cursor:pointer;background:#fff;border-radius:16px;padding:11px 15px;z-index:8;
    box-shadow:0 0 0 4px var(--choco), 0 8px 10px rgba(0,0,0,.25);text-align:left}
  .tag::before{content:"";position:absolute;width:3px;height:34px;background:var(--choco);top:-34px;left:50%}
  .tag::after{content:"";position:absolute;width:10px;height:10px;border:3px solid var(--choco);border-radius:50%;background:#fff;top:-46px;left:calc(50% - 5px)}
  .tag .tnm{font-size:19px;font-weight:900;color:var(--choco);white-space:nowrap}
  .tag .tnm small{display:block;font-size:13.5px;color:#8a7f85;font-weight:700}
  .tag .tgo{display:inline-block;background:var(--pink);color:#fff;font-size:15px;font-weight:900;border-radius:999px;padding:4px 11px;margin-top:3px}
  .tag.tl{left:150px;top:-165px;transform:rotate(-9deg);transform-origin:50% -46px;animation:tswayL 2.2s ease-in-out infinite}
  .tag.tr{right:60px;top:-140px;transform:rotate(8deg);transform-origin:50% -46px;animation:tswayR 2.5s ease-in-out infinite}
  @keyframes tswayL{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(-3deg)}}
  @keyframes tswayR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(2deg)}}
  .tag:hover{filter:brightness(1.05)}
  .tag:active{transform:scale(.96)}

/* ===== 接続パネル ===== */
  .conn{position:absolute;left:50%;top:56%;transform:translateX(-50%);z-index:8;display:none;
    flex-direction:column;align-items:center;gap:10px;width:min(92vw,460px)}
  .st.half .conn{display:flex;animation:cin .5s ease}
  @keyframes cin{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%)}}
  .conn .msg{font-size:15px;font-weight:700;color:#fff;opacity:.85;letter-spacing:1px}
  .devrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .dev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:172px;aspect-ratio:1/1;border:0;border-radius:16px;background:var(--mint2);cursor:pointer;
    transition:transform .15s ease;box-shadow:0 4px 10px rgba(0,0,0,.10)}
  .dev:hover{transform:scale(1.04)}
  .dev:active{transform:scale(.95)}
  .dev.bt{background:#FDE2F3}
  .dev .badge{display:flex;align-items:center;justify-content:center;width:86px;height:86px;border-radius:50%;
    background:rgba(255,255,255,.75);font-size:46px}
  .dev .nm{font-size:20px;font-weight:900;color:var(--choco);line-height:1.15;text-align:center}
  .dev .nm small{display:block;font-size:13px;color:#8a7f85;font-weight:700}
  .dev .go{color:var(--pink3);font-size:15px;font-weight:900}
  .looking{font-size:15px;color:#7a6f76;background:#fffb;border-radius:999px;padding:4px 14px}
  .looking i{display:inline-block;animation:blink 1.2s infinite;font-style:normal}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  /* Welcome=ピンク系(布の茶色とかぶらない色に変更)/ガイド=ミント */
  .subrow{display:flex;gap:10px;margin-top:6px;flex-wrap:nowrap;justify-content:center}
  .sbtn{border:0;cursor:pointer;font-size:15px;font-weight:900;border-radius:999px;padding:8px 13px;white-space:nowrap}
  .sbtn.ug{background:linear-gradient(160deg,#ffd3e6,var(--pink2) 45%,var(--pink));color:#7c2350;box-shadow:0 4px 0 var(--pink3)}
  .sbtn.guide{background:#fff;color:#3f7a72;border:3px solid var(--mint);box-shadow:0 4px 0 var(--mint)}
  .sbtn:active{transform:translateY(3px);box-shadow:none}

  .title{position:absolute;left:0;right:0;top:9%;text-align:center;z-index:8;font-size:min(11vw,72px);font-weight:900;color:var(--choco);
    opacity:0;transform:translateY(-20px);transition:all .5s ease .7s}
  .st.open .title{opacity:1;transform:none}
</style></head>
<body>
<div class="home"><div class="collar"></div><div class="print">ちびボード</div><div class="stitch sl"></div><div class="stitch sr"></div></div>
<div class="st" id="st">
  <div class="earwin"><div class="usagi"><img src="/src/assets/batsubei600.png" alt="ばつべー"></div></div>
  <div class="cloth l"></div><div class="cloth r"></div>
  <div class="tape tl-up"></div><div class="tape tr-up"></div>
  <div class="tape tl-dn"></div><div class="tape tr-dn"></div>
  <div class="earsout">
    <div class="earclip"><div class="earwrap"><img class="earimg" src="/src/assets/batsubei600.png" alt=""></div></div>
    <button class="tag tl" onclick="connect(this)"><span class="tnm">🔌 tibiboard30<small>USB</small></span><span class="tgo">つなぐ</span></button>
    <button class="tag tr" onclick="connect(this)"><span class="tnm">📶 tibiboard30<small>Bluetooth</small></span><span class="tgo">つなぐ</span></button>
  </div>
  <div class="zslider" id="sl"><div class="zs-crown"></div><div class="zs-body"></div><div class="zs-hinge"></div><div class="zs-pull"></div></div>
  <div class="conn" id="conn">
    <div class="subrow">
      <button class="sbtn ug">✨ Welcome to Underground ✨</button>
      <button class="sbtn guide">🔰 初心者ガイド</button>
    </div>
  </div>
</div>
<div class="hint">半分→耳の先がななめににゅっ+機器一覧 → 「つなぐ」で全開(開いた後クリックで再演)</div>
<script>
const st=document.getElementById('st');
const msg={set textContent(v){}};
let busy=false;
function start(){
  busy=false; st.classList.remove('open');
  
  st.classList.remove('half'); void st.offsetWidth;
  setTimeout(()=>{ st.classList.add('half'); },250);
}
function connect(el){
  if(busy)return; busy=true;
  msg.textContent='せつぞく中…';
  setTimeout(()=>{
    msg.textContent='つながった!';
    setTimeout(()=>{ st.classList.remove('half'); st.classList.add('open'); },450);
  },1000);
}
start();
document.body.addEventListener('click',e=>{ if(st.classList.contains('open')) start(); });
</script>
</body></html>
