<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ジッパー演出案</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif}
  .stage{position:fixed;inset:0}
  /* ホーム画面のふり */
  .home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f7f5f9}
  .home h1{font-size:56px;color:#5e3e2d;margin:0}
  .home p{font-size:22px;color:#777}
  /* 布(パーカー) */
  .cloth{position:absolute;top:0;bottom:0;width:51%;background:#bfe9e2;z-index:5;transition:transform 1.1s cubic-bezier(.7,0,.3,1)}
  .cloth.l{left:0;background:
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(94,62,45,.30) 46px 48px),#bfe9e2}
  .cloth.r{right:0;background:
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(94,62,45,.30) 46px 48px),#bfe9e2}
  .cloth.l{box-shadow:inset -18px 0 24px rgba(0,0,0,.10)}
  .cloth.r{box-shadow:inset 18px 0 24px rgba(0,0,0,.10)}
  .open .cloth.l{transform:translateX(-100%) rotate(-2deg)}
  .open .cloth.r{transform:translateX(100%) rotate(2deg)}
  /* ジッパーの歯 */
  .teeth{position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);z-index:6;
    background:repeating-linear-gradient(180deg,#7a5236 0 14px,#5e3e2d 14px 18px);border-left:3px solid #4a3123;border-right:3px solid #4a3123;
    transition:opacity .3s}
  .open .teeth{opacity:0;transition-delay:.9s}
  /* スライダー(引き手) */
  .slider{position:absolute;left:50%;top:-70px;transform:translateX(-50%);z-index:7;transition:top 1.2s cubic-bezier(.6,.1,.4,.9)}
  .go .slider{top:105%}
  .slider .body{width:46px;height:64px;background:linear-gradient(#e9e9ef,#9a9aa6);border-radius:12px 12px 18px 18px;border:3px solid #6d6d78;margin:0 auto}
  .slider .pull{width:22px;height:52px;background:linear-gradient(#ffb3d1,#f06ba0);border:3px solid #c94f83;border-radius:11px;margin:-6px auto 0}
  /* 開いた奥は暗→明 */
  .void{position:absolute;inset:0;background:#5a555e;z-index:1;transition:opacity .6s;transition-delay:1.2s}
  .open .void{opacity:0}
  /* ばつべー */
  .usagi{position:absolute;left:50%;bottom:-40%;transform:translateX(-50%);z-index:4;width:230px;transition:bottom .55s cubic-bezier(.3,1.6,.5,1)}
  .open .usagi{bottom:26%}
  .usagi img{width:100%;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
  .hint{position:fixed;right:16px;bottom:12px;z-index:9;font-size:18px;color:#888}
</style></head>
<body>
<div class="stage" id="st">
  <div class="home"><h1>ちびボード</h1><p>(ここが本来のホーム画面)</p></div>
  <div class="void"></div>
  <div class="usagi"><img src="/src/assets/batsubei600.png" alt="ばつべー"></div>
  <div class="cloth l"></div>
  <div class="cloth r"></div>
  <div class="teeth"></div>
  <div class="slider"><div class="body"></div><div class="pull"></div></div>
</div>
<div class="hint">クリックでもう一回再生</div>
<script>
  const st = document.getElementById('st');
  function play(){
    st.classList.remove('open','go');
    void st.offsetWidth;
    setTimeout(()=>st.classList.add('go'),150);     // スライダーが降りる
    setTimeout(()=>st.classList.add('open'),950);   // 布がめくれて幕が開く→ばつべーがピョン
  }
  play();
  document.body.addEventListener('click',play);
</script>
</body></html>
