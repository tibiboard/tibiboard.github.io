<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>かわいい化イメージ(タブ+ジッパー)</title>
<style>
  :root{
    --mint:#bfe9e2; --mint2:#dff5f1; --choco:#5e3e2d; --choco2:#7a5236;
    --pink:#f06ba0; --pink2:#ffb3d1; --gray:#9a9aa6; --gray2:#e9e9ef; --ash:#f4f2f6;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ash);font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif}
  .app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ===== タブバー ===== */
  .tabs{display:flex;gap:10px;padding:14px 16px 0;background:var(--mint2);border-bottom:4px solid var(--mint)}
  .tab{position:relative;border:0;border-radius:16px 16px 0 0;padding:14px 26px 12px;font-size:20px;font-weight:900;
    background:var(--gray2);color:#6f6f78;cursor:pointer}
  .tab.on{background:#fff;color:var(--choco)}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--pink)}
  .tab .usagi-mini{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:40px;display:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
  .tab.on .usagi-mini{display:block;animation:hop .5s ease}
  @keyframes hop{0%{transform:translateX(-50%) translateY(-26px)}55%{transform:translateX(-50%) translateY(4px)}80%{transform:translateX(-50%) translateY(-5px)}100%{transform:translateX(-50%) translateY(0)}}

  /* ===== 中身+ジッパーワイプ ===== */
  .content{position:relative;flex:1;overflow:hidden;background:#fff}
  .page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  .page h2{font-size:44px;color:var(--choco);margin:0}
  .page p{font-size:20px;color:#888;margin:0}
  .swatch{display:flex;gap:14px;margin-top:8px}
  .swatch div{width:64px;height:64px;border-radius:18px}
  /* ワイプ: ジッパーが横に走って中身が入れ替わる */
  .wipe{position:absolute;inset:0;pointer-events:none;opacity:0}
  .wipe.play{opacity:1}
  .wipe .clothW{position:absolute;left:0;right:0;height:51%;background:
    repeating-linear-gradient(0deg, transparent 0 40px, rgba(94,62,45,.25) 40px 42px),var(--mint)}
  .wipe .cw-t{top:0;transform:translateY(-101%)}
  .wipe .cw-b{bottom:0;transform:translateY(101%)}
  .wipe.play .cw-t{animation:closeT .18s ease forwards, openT .26s ease .3s forwards}
  .wipe.play .cw-b{animation:closeB .18s ease forwards, openB .26s ease .3s forwards}
  @keyframes closeT{to{transform:translateY(0)}}
  @keyframes closeB{to{transform:translateY(0)}}
  @keyframes openT{to{transform:translateY(-101%)}}
  @keyframes openB{to{transform:translateY(101%)}}
  .wipe .zipH{position:absolute;top:50%;left:-60px;transform:translate(0,-50%);z-index:2;opacity:0}
  .wipe.play .zipH{opacity:1;animation:zrun .3s linear forwards}
  @keyframes zrun{from{left:-60px}to{left:105%}}
  .zipH .b{width:34px;height:26px;background:linear-gradient(var(--gray2),var(--gray));border:3px solid #6d6d78;border-radius:8px}
  .zipH .p{width:26px;height:14px;background:linear-gradient(var(--pink2),var(--pink));border:3px solid #c94f83;border-radius:8px;margin:-2px 0 0 14px}

  /* ===== 起動オープニング(書き込み強化版) ===== */
  .intro{position:fixed;inset:0;z-index:50}
  .intro.done{display:none}
  .cloth{position:absolute;top:0;bottom:0;width:51%;z-index:5;
    background:repeating-linear-gradient(90deg, transparent 0 46px, rgba(94,62,45,.28) 46px 48px),var(--mint);
    transition:transform 1.0s cubic-bezier(.7,0,.3,1)}
  .cloth::before{content:"";position:absolute;top:0;bottom:0;width:26px;background:
    repeating-linear-gradient(180deg, var(--mint2) 0 22px, transparent 22px 44px)}
  .cloth.l{left:0;box-shadow:inset -22px 0 26px rgba(0,0,0,.12)}
  .cloth.l::before{right:0}
  .cloth.r{right:0;box-shadow:inset 22px 0 26px rgba(0,0,0,.12)}
  .cloth.r::before{left:0}
  .open .cloth.l{transform:translateX(-104%) rotate(-2.5deg)}
  .open .cloth.r{transform:translateX(104%) rotate(2.5deg)}
  /* 歯: 左右に分かれて開く(JSでコマを量産・スライダー通過に合わせて1コマずつ) */
  .tooth{position:absolute;left:50%;width:15px;height:12px;background:linear-gradient(var(--choco2),var(--choco));
    border:2px solid #4a3123;border-radius:3px;z-index:6;transition:transform .25s ease, opacity .4s}
  .tooth.tl{transform:translateX(-100%)}
  .tooth.tr{transform:translateX(0)}
  .tooth.tl.opened{transform:translateX(-100%) translateX(-26px) rotate(-18deg);opacity:.9}
  .tooth.tr.opened{transform:translateX(0) translateX(26px) rotate(18deg);opacity:.9}
  .open .tooth{opacity:0}
  .slider{position:absolute;left:50%;top:-90px;transform:translateX(-50%);z-index:7}
  .slider .body{width:48px;height:66px;background:linear-gradient(var(--gray2),var(--gray));border-radius:12px 12px 18px 18px;border:3px solid #6d6d78;margin:0 auto}
  .slider .pull{width:24px;height:56px;background:linear-gradient(var(--pink2),var(--pink));border:3px solid #c94f83;border-radius:12px;margin:-6px auto 0;animation:sway 1.1s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
  .void{position:absolute;inset:0;background:#6a6470;z-index:1;transition:opacity .5s;transition-delay:1.0s}
  .open .void{opacity:0}
  .usagi{position:absolute;left:50%;bottom:-45%;margin-left:-115px;z-index:4;width:230px}
  .open .usagi{animation:jump .9s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes jump{0%{bottom:-45%}55%{bottom:34%}75%{bottom:24%}88%{bottom:28%}100%{bottom:26%}}
  .usagi img{width:100%;display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28))}
  /* 着地の星(ピンクのワンポイント) */
  .star{position:absolute;width:14px;height:14px;background:var(--pink);z-index:8;opacity:0;border-radius:3px;
    clip-path:polygon(50% 0,63% 35%,100% 38%,72% 60%,82% 100%,50% 76%,18% 100%,28% 60%,0 38%,37% 35%)}
  .open .star{animation:pop .7s ease .55s forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(1.6) translateY(-40px)}}
  .title{position:absolute;left:0;right:0;top:14%;text-align:center;z-index:8;font-size:64px;font-weight:900;color:var(--choco);
    opacity:0;transform:translateY(-24px);transition:all .5s ease 1.5s}
  .open .title{opacity:1;transform:none}
  .hint{position:fixed;left:16px;bottom:12px;z-index:60;font-size:18px;color:#666;background:#fff9;border-radius:10px;padding:6px 12px}
</style></head>
<body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div class="content">
    <div class="page" id="page"></div>
    <div class="wipe" id="wipe">
      <div class="clothW cw-t"></div><div class="clothW cw-b"></div>
      <div class="zipH"><div class="b"></div><div class="p"></div></div>
    </div>
  </div>
</div>

<div class="intro" id="intro">
  <div class="void"></div>
  <div class="title">ちびボード</div>
  <div class="usagi"><img src="/src/assets/batsubei600.png" alt="ばつべー"></div>
  <div class="cloth l"></div><div class="cloth r"></div>
  <div id="teeth"></div>
  <div class="slider" id="sl"><div class="body"></div><div class="pull"></div></div>
</div>
<div class="hint">左下: タブを押す=ジッパーワイプ / ここをクリック=オープニング再生</div>

<script>
const TABS=[["🏠","ホーム"],["⌨","キーマップ"],["🔔","しんどう"],["🎁","たからばこ"]];
const PAGES={
 "ホーム":["ホーム","起動のあいさつ画面。ばつべーが待ってる"],
 "キーマップ":["キーマップ","文字の部屋(振動はしんどうタブへ)"],
 "しんどう":["しんどう","振動の部屋。族のバッジが動く"],
 "たからばこ":["たからばこ","チョコミント箱とごほうび"]};
const tabsEl=document.getElementById('tabs');
const pageEl=document.getElementById('page');
const wipe=document.getElementById('wipe');
let cur="ホーム";
function renderTabs(){
  tabsEl.innerHTML='';
  for(const [ic,name] of TABS){
    const b=document.createElement('button');
    b.className='tab'+(name===cur?' on':'');
    b.innerHTML=`<img class="usagi-mini" src="/src/assets/batsubei600.png">${ic} ${name}`;
    b.onclick=(e)=>{e.stopPropagation(); if(name===cur) return; switchTo(name);};
    tabsEl.appendChild(b);
  }
}
function renderPage(){
  const [t,d]=PAGES[cur];
  pageEl.innerHTML=`<h2>${t}</h2><p>${d}</p>
   <div class="swatch"><div style="background:var(--mint)"></div><div style="background:var(--pink2)"></div><div style="background:var(--gray2)"></div></div>`;
}
function switchTo(name){
  wipe.classList.remove('play'); void wipe.offsetWidth; wipe.classList.add('play');
  setTimeout(()=>{cur=name; renderTabs(); renderPage();},200);
  setTimeout(()=>wipe.classList.remove('play'),700);
}
renderTabs(); renderPage();

/* ===== オープニング ===== */
const intro=document.getElementById('intro');
const teethBox=document.getElementById('teeth');
const sl=document.getElementById('sl');
const N=26; let teeth=[];
function buildTeeth(){
  teethBox.innerHTML=''; teeth=[];
  for(let i=0;i<N;i++){
    for(const side of ['tl','tr']){
      const d=document.createElement('div');
      d.className='tooth '+side;
      d.style.top=(i*100/N)+'%';
      teethBox.appendChild(d);
    }
  }
  teeth=[...teethBox.children];
  // 着地の星
  for(let i=0;i<6;i++){
    const s=document.createElement('div');s.className='star';
    s.style.left=(38+Math.sin(i*7)*0+ i*5)+'%'; s.style.bottom=(24+ (i%3)*6)+'%';
    s.style.animationDelay=(0.5+i*0.06)+'s';
    intro.appendChild(s);
  }
}
function playIntro(){
  intro.classList.remove('done','open');
  [...intro.querySelectorAll('.star')].forEach(e=>e.remove());
  buildTeeth();
  sl.style.transition='none'; sl.style.top='-90px'; void sl.offsetWidth;
  sl.style.transition='top 1.15s cubic-bezier(.55,.1,.45,.9)';
  setTimeout(()=>{ sl.style.top='106%'; },120);
  // スライダー通過に合わせて歯を1段ずつ開く
  const t0=performance.now()+120;
  function step(now){
    const p=Math.min(1,(now-t0)/1150);
    const row=Math.floor(p*N);
    teeth.forEach((el,idx)=>{ if(Math.floor(idx/2)<=row) el.classList.add('opened'); });
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(()=>intro.classList.add('open'),1050);   // 布めくれ→ばつべージャンプ→星→タイトル
  setTimeout(()=>intro.classList.add('done'),3200);   // 終了→アプリへ
}
playIntro();
document.body.addEventListener('click',()=>{ if(intro.classList.contains('done')) playIntro(); });
</script>
</body></html>
