<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丸UI見本(いま vs 丸柔らか)</title>
<style>
  :root { --pink:#f472b6; --pinkbg:#fde7f1; --choco:#5d4037; --mint:#d7f5ec; --mint2:#bdeadd; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif; }
  body { background:#eceff1; padding:24px; color:#37474f; }
  h1 { font-size:30px; margin-bottom:18px; }
  .cols { display:flex; gap:22px; flex-wrap:wrap; }
  .col { flex:1; min-width:420px; background:#fff; border-radius:24px; padding:20px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .col h2 { font-size:24px; margin-bottom:14px; }
  .stage { border-radius:16px; padding:16px; }
  /* ===== いま(カクカク) ===== */
  .now .stage { background:#f4f4f5; border:1px solid #d4d4d8; border-radius:6px; }
  .now .tabs { display:flex; gap:2px; margin-bottom:12px; }
  .now .tab { padding:7px 16px; font-size:18px; background:#e4e4e7; border:1px solid #d4d4d8; }
  .now .tab.on { background:#fff; border-bottom-color:#fff; font-weight:bold; }
  .now .key { width:54px; height:54px; background:#fff; border:1px solid #a1a1aa; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; }
  .now .keys { display:flex; gap:6px; margin-bottom:12px; }
  .now .key.sel { border:2px solid #ec4899; }
  .now button { font-size:18px; padding:8px 18px; border:1px solid #a1a1aa; background:#fff; border-radius:4px; }
  .now button.primary { background:#ec4899; border-color:#ec4899; color:#fff; }
  .now .card { border:1px solid #d4d4d8; border-radius:4px; background:#fff; padding:10px; font-size:17px; margin-top:10px; }
  /* ===== 丸柔らか ===== */
  .soft .stage { background:#f6faf9; border-radius:22px; }
  .soft .tabs { display:flex; gap:10px; margin-bottom:14px; }
  .soft .tab { padding:9px 22px; font-size:18px; background:#e8ecee; border-radius:999px; }
  .soft .tab.on { background:var(--pink); color:#fff; font-weight:bold; box-shadow:0 3px 8px rgba(244,114,182,.4); }
  .soft .keys { display:flex; gap:8px; margin-bottom:14px; }
  .soft .key { width:56px; height:56px; background:#fff; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; box-shadow:0 3px 6px rgba(0,0,0,.10), inset 0 1px 0 #fff; }
  .soft .key.sel { background:var(--pinkbg); box-shadow:0 0 0 3px var(--pink), 0 3px 6px rgba(0,0,0,.10); }
  .soft button { font-size:18px; padding:10px 22px; border:none; background:#fff; border-radius:999px; box-shadow:0 3px 6px rgba(0,0,0,.12); }
  .soft button.primary { background:var(--pink); color:#fff; box-shadow:0 4px 10px rgba(244,114,182,.45); }
  .soft .card { border-radius:18px; background:#fff; padding:12px 14px; font-size:17px; margin-top:12px; box-shadow:0 3px 8px rgba(0,0,0,.07); border:none; }
  .soft .card .bar { height:8px; border-radius:999px; background:var(--mint2); margin-top:8px; }
  .row { display:flex; gap:10px; margin-top:12px; }
  .memo { font-size:18px; background:var(--mint); color:var(--choco); border-radius:14px; padding:10px 14px; margin-top:14px; }
</style>
</head>
<body>
<h1>いまのUI と 丸柔らかUI の見比べ</h1>
<div class="cols">
  <div class="col now">
    <h2>😐 いま(角ばり系)</h2>
    <div class="stage">
      <div class="tabs"><div class="tab on">ホーム</div><div class="tab">Keymap</div><div class="tab">Combos</div></div>
      <div class="keys"><div class="key">Q</div><div class="key sel">W</div><div class="key">E</div><div class="key">R</div></div>
      <div class="row"><button class="primary">変える</button><button>外す</button></div>
      <div class="card">🥊 コツン 100% — 一発だけ「コツッ」</div>
    </div>
  </div>
  <div class="col soft">
    <h2>🐰 丸柔らか(提案)</h2>
    <div class="stage" style="padding:16px;">
      <div class="tabs"><div class="tab on">ホーム</div><div class="tab">キーマップ</div><div class="tab">コンボ</div></div>
      <div class="keys"><div class="key">Q</div><div class="key sel">W</div><div class="key">E</div><div class="key">R</div></div>
      <div class="row"><button class="primary">変える</button><button>外す</button></div>
      <div class="card">🥊 コツン 100% — 一発だけ「コツッ」<div class="bar"></div></div>
    </div>
    <div class="memo">変える所: 角丸を大きく(4px→18px)・枠線をやめて柔らかい影・タブは錠剤形・キーは角丸+ぷっくり影・選択はピンクの光る輪。色は灰/ピンク/チョコミントのまま。</div>
  </div>
</div>
</body>
</html>
