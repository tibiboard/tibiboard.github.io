<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ジッパー10案+ボタン部品集</title>
<style>
  :root{--mint:#bfe9e2;--mint2:#dff5f1;--choco:#5e3e2d;--choco2:#7a5236;--choco3:#4a3123;
        --pink:#f06ba0;--pink2:#ffb3d1;--pink3:#c94f83;--gray:#9a9aa6;--gray2:#e9e9ef;--gray3:#6d6d78;--ash:#f4f2f6}
  body{margin:0;background:var(--ash);font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;padding:18px}
  h1{font-size:26px;color:var(--choco);margin:0 0 12px}
  h1 small{font-size:16px;color:#888;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-bottom:30px}
  .card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .demo{position:relative;height:200px;overflow:hidden;background:var(--mint2)}
  .cap{padding:9px 14px}.cap b{font-size:19px;color:var(--choco)}
  .cap p{margin:3px 0 0;font-size:15px;color:#777;line-height:1.45}

  /* ====== ジッパー部品(書き込み版) ====== */
  .zwrap{position:absolute;inset:-40%;display:flex;align-items:stretch;justify-content:center}
  .zw-cloth{flex:1;position:relative;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(94,62,45,.22) 26px 27px),var(--mint)}
  .zw-cloth.cl{box-shadow:inset -14px 0 18px rgba(0,0,0,.13);border-right:6px solid rgba(94,62,45,.35)}
  .zw-cloth.cr{box-shadow:inset 14px 0 18px rgba(0,0,0,.13);border-left:6px solid rgba(94,62,45,.35)}
  .zw-teeth{position:relative;width:0;z-index:2}
  .tooth{position:absolute;width:17px;height:11px;border-radius:3px 5px 5px 3px;
    background:linear-gradient(180deg,var(--choco2) 0 55%,var(--choco) 55%);border:2px solid var(--choco3);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
  .tooth.L{right:-6px}
  .tooth.R{left:-6px;border-radius:5px 3px 3px 5px}
  /* スライダー(胴=入れ子の金属・引き手つき) */
  .zslider{position:absolute;left:50%;width:66px;margin-left:-33px;z-index:4;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
  .zs-crown{width:34px;height:10px;margin:0 auto;background:linear-gradient(var(--gray2),var(--gray));border:3px solid var(--gray3);border-bottom:0;border-radius:8px 8px 0 0}
  .zs-body{position:relative;width:54px;height:44px;margin:0 auto;border:3px solid var(--gray3);border-radius:10px 10px 22px 22px;
    background:linear-gradient(180deg,#f5f5fa 0%,var(--gray2) 35%,var(--gray) 100%)}
  .zs-body::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:12px;margin-left:-6px;border-radius:6px;
    background:linear-gradient(180deg,#7d7d88,#5a5a64);box-shadow:inset 0 0 4px #000a}       /* 歯が通る入れ子の溝 */
  .zs-body::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#cfcfd8)}                               /* リベットの光 */
  .zs-hinge{width:12px;height:10px;margin:-2px auto 0;background:var(--gray3);border-radius:0 0 4px 4px}
  .zs-pull{width:26px;height:44px;margin:0 auto;border:3px solid var(--pink3);border-radius:13px;
    background:linear-gradient(160deg,#ffd3e6,var(--pink2) 40%,var(--pink) 100%);position:relative;
    transform-origin:top center;animation:pullsway 1.3s ease-in-out infinite}
  .zs-pull::before{content:"";position:absolute;left:50%;top:16px;width:12px;height:16px;margin-left:-6px;border-radius:7px;
    background:var(--ash);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}                          /* 引き手の穴 */
  .zs-pull::after{content:"";position:absolute;left:4px;top:4px;width:8px;height:10px;border-radius:50%;
    background:rgba(255,255,255,.65)}                                                          /* つや */
  @keyframes pullsway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}

  /* 汎用アニメ */
  .run .zslider{animation:slidedown var(--dur,2.6s) var(--ease,cubic-bezier(.55,.1,.45,.9)) infinite}
  @keyframes slidedown{0%,12%{top:-90px}70%,100%{top:104%}}
  .run .zw-cloth.cl{animation:clothL var(--dur,2.6s) ease infinite}
  .run .zw-cloth.cr{animation:clothR var(--dur,2.6s) ease infinite}
  @keyframes clothL{0%,62%{transform:none}88%,100%{transform:translateX(-58%) rotate(-2deg)}}
  @keyframes clothR{0%,62%{transform:none}88%,100%{transform:translateX(58%) rotate(2deg)}}

  /* 向きバリエーション */
  .rot90 .zwrap{transform:rotate(90deg)}
  .rot45 .zwrap{transform:rotate(45deg)}
  .rot180 .zwrap{transform:rotate(180deg)}

  /* 波めくれ */
  .wavy .zw-cloth.cl{animation:clothLw var(--dur) ease infinite}
  .wavy .zw-cloth.cr{animation:clothRw var(--dur) ease infinite}
  @keyframes clothLw{0%,62%{transform:none}74%{transform:translateX(-18%) rotate(-6deg) skewY(4deg)}88%,100%{transform:translateX(-60%) rotate(-1deg) skewY(-2deg)}}
  @keyframes clothRw{0%,62%{transform:none}74%{transform:translateX(18%) rotate(6deg) skewY(-4deg)}88%,100%{transform:translateX(60%) rotate(1deg) skewY(2deg)}}

  /* ばつべーチャーム引き手 */
  .charm .zs-pull{background:none;border:0;width:44px;height:52px}
  .charm .zs-pull::before{display:none}.charm .zs-pull::after{display:none}
  .charm .zs-pull img{width:44px;display:block}
  .charm .zs-ring{width:16px;height:16px;border:4px solid var(--gray3);border-radius:50%;margin:-3px auto 2px;background:transparent}

  /* ハート引き手 */
  .heart .zs-pull{background:none;border:0;width:40px;height:42px}
  .heart .zs-pull::before{display:none}.heart .zs-pull::after{display:none}
  .heart .hp{position:relative;width:36px;height:32px;margin:4px auto 0}
  .heart .hp::before,.heart .hp::after{content:"";position:absolute;top:0;width:18px;height:28px;border-radius:10px 10px 0 0;background:linear-gradient(160deg,var(--pink2),var(--pink));border:2px solid var(--pink3)}
  .heart .hp::before{left:0;transform:rotate(-42deg);transform-origin:100% 100%}
  .heart .hp::after{right:0;transform:rotate(42deg);transform-origin:0% 100%}

  /* 逆配色(チョコ布×ミント歯) */
  .rev .zw-cloth{background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,.14) 26px 27px),var(--choco2)}
  .rev .tooth{background:linear-gradient(180deg,#d9f3ee 0 55%,var(--mint) 55%);border-color:#7bb8ae}

  /* ====== ボタン部品集 ====== */
  .parts{display:flex;flex-wrap:wrap;gap:22px;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .part{display:flex;flex-direction:column;align-items:center;gap:8px}
  .part span{font-size:15px;color:#777}
  /* P1 ジッパータブ(タブバー) */
  .ptabs{display:flex;gap:8px;background:var(--mint2);padding:12px 12px 0;border-radius:14px 14px 0 0;border-bottom:5px solid var(--choco2)}
  .ptab{border:0;border-radius:12px 12px 0 0;padding:10px 18px;font-size:18px;font-weight:900;background:var(--gray2);color:#6f6f78;cursor:pointer;position:relative}
  .ptab.on{background:#fff;color:var(--choco)}
  .ptab.on::before{content:"";position:absolute;left:8px;right:8px;bottom:-5px;height:5px;
    background:repeating-linear-gradient(90deg,var(--pink) 0 7px,var(--pink3) 7px 9px);border-radius:2px}   /* 選択中だけ歯がピンク */
  /* P2 ジッパースイッチ(ON/OFF) */
  .pzip{position:relative;width:150px;height:44px;border-radius:22px;background:var(--gray2);border:3px solid var(--gray3);cursor:pointer;overflow:visible}
  .pzip .rail{position:absolute;left:12px;right:12px;top:50%;height:8px;margin-top:-4px;border-radius:4px;
    background:repeating-linear-gradient(90deg,var(--choco2) 0 8px,var(--choco) 8px 10px)}
  .pzip .knob{position:absolute;top:-8px;left:6px;width:34px;height:30px;border-radius:8px 8px 14px 14px;
    background:linear-gradient(var(--gray2),var(--gray));border:3px solid var(--gray3);transition:left .25s}
  .pzip .knob::after{content:"";position:absolute;left:50%;top:26px;width:14px;height:24px;margin-left:-7px;border-radius:7px;
    background:linear-gradient(var(--pink2),var(--pink));border:2px solid var(--pink3)}
  .pzip.on{background:var(--mint)}
  .pzip.on .knob{left:100px}
  /* P3 キーキャップボタン */
  .pkey{width:64px;height:64px;border-radius:14px;border:0;cursor:pointer;font-size:26px;font-weight:900;color:var(--choco);
    background:linear-gradient(#fff,var(--gray2));box-shadow:0 6px 0 var(--gray),0 8px 8px rgba(0,0,0,.18);transition:all .08s}
  .pkey:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gray)}
  .pkey.pink{background:linear-gradient(#ffe2ef,var(--pink2));box-shadow:0 6px 0 var(--pink3),0 8px 8px rgba(0,0,0,.18);color:#8d2f5e}
  /* P4 チョコ板ボタン */
  .pchoco{border:0;cursor:pointer;padding:0;border-radius:10px;overflow:hidden;box-shadow:0 5px 0 var(--choco3),0 7px 8px rgba(0,0,0,.2)}
  .pchoco .in{display:grid;grid-template-columns:repeat(3,34px);grid-auto-rows:30px;gap:3px;background:var(--choco3);padding:3px}
  .pchoco .in i{background:linear-gradient(145deg,var(--choco2),var(--choco));border-radius:4px}
  .pchoco b{position:absolute;color:#fff;font-size:18px}
  .pchoco{position:relative;display:flex;align-items:center;justify-content:center}
  /* P5 引き手そのものをボタンに */
  .ppull{width:46px;height:78px;border:0;background:none;cursor:pointer;position:relative}
  .ppull .ring{width:20px;height:20px;border:5px solid var(--gray3);border-radius:50%;margin:0 auto}
  .ppull .tab{width:34px;height:52px;margin:-4px auto 0;border-radius:16px;border:3px solid var(--pink3);
    background:linear-gradient(160deg,#ffd3e6,var(--pink2) 40%,var(--pink));position:relative}
  .ppull .tab::before{content:"";position:absolute;left:50%;top:18px;width:14px;height:18px;margin-left:-7px;border-radius:8px;background:var(--ash);box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
  .ppull:active .tab{transform:translateY(4px)}
</style></head>
<body>
<h1>① ジッパー演出 10案 <small>(全部ループ中。金具=胴の入れ子溝・リベット・穴あき引き手まで描き込み版)</small></h1>
<div class="grid" id="zgrid"></div>

<h1>② ジッパー世界観のボタン部品集 <small>(タブ・スイッチ・ボタンのパターン。押せる)</small></h1>
<div class="parts">
  <div class="part">
    <div class="ptabs"><button class="ptab on">🏠 ホーム</button><button class="ptab">⌨ キーマップ</button><button class="ptab">🔔 しんどう</button></div>
    <span>P1 タブ: 選択中の下線がピンクの歯</span>
  </div>
  <div class="part"><div class="pzip on" onclick="this.classList.toggle('on')"><div class="rail"></div><div class="knob"></div></div><span>P2 ON/OFF=ジッパーを閉める/開ける(クリック)</span></div>
  <div class="part"><div style="display:flex;gap:10px"><button class="pkey">ち</button><button class="pkey pink">び</button></div><span>P3 キーキャップ型(押すと沈む)</span></div>
  <div class="part"><button class="pchoco"><span class="in"><i></i><i></i><i></i><i></i><i></i><i></i></span><b>けってい</b></button><span>P4 チョコ板型</span></div>
  <div class="part"><button class="ppull"><span class="ring"></span><span class="tab"></span></button><span>P5 引き手そのもの(戻る/閉じる用)</span></div>
</div>

<script>
const VARIANTS=[
 ["Z1 基本(縦・センター)","本命の型。ジーッと降りて左右へ",""],
 ["Z2 横走り","左→右へ走る。タブ切替ワイプ向き","rot90"],
 ["Z3 ななめ45°","勢い重視。動画のカット割りっぽい","rot45"],
 ["Z4 下から上","逆再生の意外性。閉じる演出にも","rot180"],
 ["Z5 ばつべーチャーム","引き手にばつべーがぶら下がる","charm"],
 ["Z6 ハート引き手","引き手がピンクのハート金具","heart"],
 ["Z7 逆配色","チョコの布×ミントの歯","rev"],
 ["Z8 波めくれ","開いた布がふわっと波打つ","wavy"],
 ["Z9 タメて一気","途中で止まって…ジャッ!と最後まで","tame"],
 ["Z10 ゆっくり上品","長め・静かに開く(高級路線)","slow"],
];
const grid=document.getElementById('zgrid');
for(const [name,desc,mod] of VARIANTS){
  const card=document.createElement('div');card.className='card';
  const demo=document.createElement('div');
  demo.className='demo run '+mod;
  if(mod==='tame'){demo.style.setProperty('--ease','cubic-bezier(.9,0,.1,1)');demo.style.setProperty('--dur','3s');}
  else if(mod==='slow'){demo.style.setProperty('--dur','4.6s');demo.style.setProperty('--ease','ease-in-out');}
  else demo.style.setProperty('--dur','2.8s');
  const wrap=document.createElement('div');wrap.className='zwrap';
  wrap.innerHTML='<div class="zw-cloth cl"></div><div class="zw-teeth"></div><div class="zw-cloth cr"></div>';
  demo.appendChild(wrap);
  const teeth=wrap.querySelector('.zw-teeth');
  for(let i=0;i<24;i++){
    const t=document.createElement('div');
    t.className='tooth '+(i%2?'R':'L');
    t.style.top=(i*100/24)+'%';
    teeth.appendChild(t);
  }
  const sl=document.createElement('div');sl.className='zslider';sl.style.top='-90px';
  if(mod==='charm'){
    sl.innerHTML='<div class="zs-crown"></div><div class="zs-body"></div><div class="zs-hinge"></div><div class="zs-pull"><div class="zs-ring"></div><img src="/src/assets/batsubei600.png"></div>';
  }else if(mod==='heart'){
    sl.innerHTML='<div class="zs-crown"></div><div class="zs-body"></div><div class="zs-hinge"></div><div class="zs-pull"><div class="hp"></div></div>';
  }else{
    sl.innerHTML='<div class="zs-crown"></div><div class="zs-body"></div><div class="zs-hinge"></div><div class="zs-pull"></div>';
  }
  wrap.appendChild(sl);
  card.appendChild(demo);
  const cap=document.createElement('div');cap.className='cap';cap.innerHTML=`<b>${name}</b><p>${desc}</p>`;
  card.appendChild(cap);
  grid.appendChild(card);
}
</script>
</body></html>
