<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Z1×大きいばつべー登場 6案</title>
<style>
  :root{--mint:#bfe9e2;--mint2:#dff5f1;--choco:#5e3e2d;--choco2:#7a5236;--choco3:#4a3123;
        --pink:#f06ba0;--pink2:#ffb3d1;--pink3:#c94f83;--gray:#9a9aa6;--gray2:#e9e9ef;--gray3:#6d6d78;--ash:#f4f2f6}
  body{margin:0;background:var(--ash);font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;padding:18px}
  h1{font-size:26px;color:var(--choco);margin:0 0 4px}
  .sub{font-size:16px;color:#777;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .demo{position:relative;height:290px;overflow:hidden;background:#fff}
  .cap{padding:9px 14px}.cap b{font-size:19px;color:var(--choco)}
  .cap p{margin:3px 0 0;font-size:15px;color:#777;line-height:1.45}
  .home{position:absolute;inset:0;background:#fff;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:24px;font-weight:900;color:var(--choco)}

  /* Z1のジッパー(書き込み版・共通) */
  .cloth{position:absolute;top:0;bottom:0;width:51%;z-index:5;
    background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(94,62,45,.22) 26px 27px),var(--mint);
    animation:var(--cl) var(--dur) ease infinite}
  .cloth.l{left:0;--cl:cl;box-shadow:inset -14px 0 18px rgba(0,0,0,.13);border-right:6px solid rgba(94,62,45,.35)}
  .cloth.r{right:0;--cl:cr;box-shadow:inset 14px 0 18px rgba(0,0,0,.13);border-left:6px solid rgba(94,62,45,.35)}
  @keyframes cl{0%,40%{transform:none}62%,100%{transform:translateX(-104%) rotate(-2deg)}}
  @keyframes cr{0%,40%{transform:none}62%,100%{transform:translateX(104%) rotate(2deg)}}
  .teethbox{position:absolute;inset:0;z-index:6;pointer-events:none;animation:teethfade var(--dur) linear infinite}
  @keyframes teethfade{0%,40%{opacity:1}52%,100%{opacity:0}}
  .tooth{position:absolute;left:50%;width:15px;height:10px;border-radius:3px 5px 5px 3px;
    background:linear-gradient(180deg,var(--choco2) 0 55%,var(--choco) 55%);border:2px solid var(--choco3)}
  .tooth.L{transform:translateX(-100%)}
  .zslider{position:absolute;left:50%;width:60px;margin-left:-30px;z-index:7;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));
    animation:zdown var(--dur) cubic-bezier(.55,.1,.45,.9) infinite}
  @keyframes zdown{0%,6%{top:-95px}40%,100%{top:104%}}
  .zs-crown{width:30px;height:9px;margin:0 auto;background:linear-gradient(var(--gray2),var(--gray));border:3px solid var(--gray3);border-bottom:0;border-radius:8px 8px 0 0}
  .zs-body{position:relative;width:48px;height:40px;margin:0 auto;border:3px solid var(--gray3);border-radius:10px 10px 20px 20px;
    background:linear-gradient(180deg,#f5f5fa,var(--gray2) 35%,var(--gray))}
  .zs-body::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:11px;margin-left:-5.5px;border-radius:5px;
    background:linear-gradient(180deg,#7d7d88,#5a5a64);box-shadow:inset 0 0 4px #000a}
  .zs-pull{width:24px;height:40px;margin:-2px auto 0;border:3px solid var(--pink3);border-radius:12px;
    background:linear-gradient(160deg,#ffd3e6,var(--pink2) 40%,var(--pink));position:relative;transform-origin:top center;animation:pullsway 1.2s ease-in-out infinite}
  .zs-pull::before{content:"";position:absolute;left:50%;top:14px;width:11px;height:15px;margin-left:-5.5px;border-radius:6px;background:var(--ash);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
  @keyframes pullsway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}

  .u{position:absolute;z-index:4;pointer-events:none}
  .u img{width:100%;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}

  /* U1 正面ドーン(でか跳ね) */
  .u1{left:50%;bottom:-90%;width:210px;margin-left:-105px;animation:u1 var(--dur) cubic-bezier(.3,1.5,.5,1) infinite}
  @keyframes u1{0%,45%{bottom:-90%}68%{bottom:14%}80%{bottom:4%}90%{bottom:9%}100%{bottom:7%}}
  /* U2 顔ひょっこり→全身 */
  .u2{left:50%;bottom:-98%;width:250px;margin-left:-125px;animation:u2 var(--dur) ease infinite}
  @keyframes u2{0%,42%{bottom:-98%}55%{bottom:-58%}64%{bottom:-64%}74%{bottom:-58%}82%,100%{bottom:2%}}
  /* U3 ロケット+星 */
  .u3{left:50%;bottom:-95%;width:200px;margin-left:-100px;animation:u3 var(--dur) cubic-bezier(.2,1.2,.6,1) infinite}
  @keyframes u3{0%,44%{bottom:-95%}58%{bottom:34%}70%{bottom:8%}80%{bottom:14%}100%{bottom:11%}}
  .star{position:absolute;width:16px;height:16px;background:var(--pink);border-radius:3px;z-index:8;opacity:0;
    clip-path:polygon(50% 0,63% 35%,100% 38%,72% 60%,82% 100%,50% 76%,18% 100%,28% 60%,0 38%,37% 35%);
    animation:star var(--dur) ease infinite}
  @keyframes star{0%,55%{opacity:0;transform:scale(.2)}66%{opacity:1;transform:scale(1.4)}80%,100%{opacity:0;transform:scale(1.8) translateY(-46px)}}
  /* U4 ぴょこぴょこ近づく(奥→手前) */
  .u4{left:50%;bottom:26%;width:60px;margin-left:-30px;animation:u4 var(--dur) ease-in infinite}
  @keyframes u4{0%,45%{width:0;bottom:40%}52%{width:70px;margin-left:-35px;bottom:34%}62%{width:110px;margin-left:-55px;bottom:26%}
    72%{width:160px;margin-left:-80px;bottom:16%}84%,100%{width:230px;margin-left:-115px;bottom:4%}}
  /* U5 上からぶら下がり */
  .u5{left:50%;top:-90%;width:190px;margin-left:-95px;animation:u5 var(--dur) cubic-bezier(.4,1.4,.6,1) infinite;transform:rotate(180deg)}
  @keyframes u5{0%,45%{top:-90%}62%{top:6%}72%{top:-2%}82%,100%{top:2%}}
  /* U6 引き手にしがみつき→着地ででかくなる */
  .u6ride{position:absolute;left:50%;margin-left:-26px;width:52px;top:-95px;z-index:8;
    animation:zdown var(--dur) cubic-bezier(.55,.1,.45,.9) infinite}
  .u6ride img{width:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
  .u6land{left:50%;bottom:-95%;width:220px;margin-left:-110px;animation:u6 var(--dur) cubic-bezier(.3,1.4,.5,1) infinite}
  @keyframes u6{0%,40%{bottom:-95%}52%{bottom:6%}64%{bottom:0%}100%{bottom:2%}}
</style></head>
<body>
<h1>Z1ジッパー × 大きいばつべー登場 6案 <small style="font-size:16px;color:#888">(全部ループ中)</small></h1>
<div class="sub">ジッパーが降り切る→布が開く→**でかいばつべー**の出方ちがい。記号で選んで。</div>
<div class="grid" id="g"></div>
<script>
const V=[
 ["U1 正面ドーン","画面の1/3サイズでぴょーんと跳ねて、ぽよんぽよんと着地",'<div class="u u1"><img src="/src/assets/batsubei600.png"></div>'],
 ["U2 ひょっこり→全身","まず耳と顔だけひょこっと覗く→ひと呼吸おいて全身どーん",'<div class="u u2"><img src="/src/assets/batsubei600.png"></div>'],
 ["U3 ロケット+星","勢いよく飛び出してピンクの星が散る",'<div class="u u3"><img src="/src/assets/batsubei600.png"></div><div class="star" style="left:30%;top:38%"></div><div class="star" style="left:62%;top:30%;animation-delay:.1s"></div><div class="star" style="left:48%;top:52%;animation-delay:.2s"></div>'],
 ["U4 ぴょこぴょこ接近","奥から3段跳びでどんどん大きくなって目の前まで来る",'<div class="u u4"><img src="/src/assets/batsubei600.png"></div>'],
 ["U5 上からぶら下がり","開いた上からさかさにひょこっ(逆さばつべー)",'<div class="u u5"><img src="/src/assets/batsubei600.png"></div>'],
 ["U6 引き手にしがみつき","小さいばつべーが引き手に乗って一緒に降りる→着地したらでかくなる",'<div class="u6ride"><img src="/src/assets/batsubei600.png" style="margin-top:96px"></div><div class="u u6land"><img src="/src/assets/batsubei600.png"></div>'],
];
const g=document.getElementById('g');
for(const [name,desc,extra] of V){
  const c=document.createElement('div');c.className='card';
  const d=document.createElement('div');d.className='demo';d.style.setProperty('--dur','3.4s');
  let teeth='';for(let i=0;i<22;i++){teeth+=`<div class="tooth ${i%2?'':'L'}" style="top:${i*100/22}%"></div>`;}
  d.innerHTML=`<div class="home">ちびボード</div>${extra}
    <div class="cloth l"></div><div class="cloth r"></div>
    <div class="teethbox">${teeth}</div>
    <div class="zslider"><div class="zs-crown"></div><div class="zs-body"></div><div class="zs-pull"></div></div>`;
  c.appendChild(d);
  const cap=document.createElement('div');cap.className='cap';cap.innerHTML=`<b>${name}</b><p>${desc}</p>`;
  c.appendChild(cap);
  g.appendChild(c);
}
</script>
</body></html>
