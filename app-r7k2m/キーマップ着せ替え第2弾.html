<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>キーマップ着せ替え 第2弾(S6〜S10)</title>
<style>
  :root{--mint:#bfe9e2;--mint2:#dff5f1;--choco:#5e3e2d;--choco2:#7a5236;--pink:#f06ba0;--pink2:#ffb3d1;--pink3:#c94f83;--gray:#9a9aa6;--gray2:#e9e9ef;--gray3:#6d6d78}
  body{margin:0;background:#f4f2f6;font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;padding:18px}
  h1{font-size:26px;color:var(--choco);margin:0 0 4px}
  .sub{font-size:16px;color:#777;margin-bottom:14px}
  .set{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:16px;margin-bottom:22px}
  .set h2{margin:0 0 10px;font-size:21px;color:var(--choco)}
  .mock{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;border-radius:14px;padding:18px}
  .board{display:grid;grid-template-columns:repeat(5,56px);gap:8px;padding:14px;border-radius:16px;position:relative}
  .key{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;border-radius:12px;cursor:pointer;user-select:none;position:relative}
  .panel{flex:1;min-width:240px;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .panel .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .panel label{font-size:17px;font-weight:700}
  .pill{border:0;border-radius:999px;padding:9px 18px;font-size:17px;font-weight:900;cursor:pointer}

  /* S6 ふわふわ雲 */
  .s6 .mock{background:linear-gradient(180deg,#eafffb,var(--mint2))}
  .s6 .board{background:#fff;border-radius:34px;box-shadow:0 10px 24px rgba(120,190,180,.3)}
  .s6 .key{border-radius:22px;background:#fff;border:3px solid var(--mint);color:#5a8a83}
  .s6 .key.sel{border-color:var(--pink);background:#fff2f8;color:var(--pink3);box-shadow:0 0 0 5px var(--pink2)}
  .s6 .panel{background:#fff;border-radius:28px;box-shadow:0 10px 24px rgba(120,190,180,.25)}
  .s6 .panel label{color:#5a8a83}
  .s6 .pill{background:var(--mint2);color:#3f7a72;border:2px solid var(--mint)}
  .s6 .pill.main{background:var(--pink);border-color:var(--pink3);color:#fff}

  /* S7 ドット絵レトロ */
  .s7 .mock{background:#2a2a33;image-rendering:pixelated}
  .s7 .board{background:#3a3a45;border:4px solid #55556a;border-radius:4px}
  .s7 .key{border-radius:2px;background:var(--gray2);color:#333;box-shadow:inset -4px -4px 0 var(--gray),inset 4px 4px 0 #fff}
  .s7 .key.sel{background:var(--pink2);box-shadow:inset -4px -4px 0 var(--pink3),inset 4px 4px 0 #ffd9ea;color:#8d2f5e}
  .s7 .panel{background:#3a3a45;border-radius:4px;border:4px solid #55556a}
  .s7 .panel label{color:var(--mint)}
  .s7 .pill{border-radius:2px;background:var(--gray2);color:#333;box-shadow:inset -3px -3px 0 var(--gray),inset 3px 3px 0 #fff}
  .s7 .pill.main{background:var(--pink2);box-shadow:inset -3px -3px 0 var(--pink3),inset 3px 3px 0 #ffd9ea;color:#8d2f5e}

  /* S8 マカロン2色ちどり */
  .s8 .mock{background:#fff}
  .s8 .board{background:var(--gray2);border-radius:22px}
  .s8 .key{border-radius:50% 50% 46% 46%;color:#7a6a70;box-shadow:0 5px 0 rgba(0,0,0,.12)}
  .s8 .key:nth-child(odd){background:linear-gradient(#eafffb,var(--mint))}
  .s8 .key:nth-child(even){background:linear-gradient(#ffeef6,var(--pink2))}
  .s8 .key.sel{outline:4px solid var(--pink);outline-offset:2px;color:#8d2f5e}
  .s8 .panel{background:#fff;border:3px solid var(--gray2);border-radius:22px}
  .s8 .panel label{color:#7a6a70}
  .s8 .pill{background:var(--gray2);color:#666}
  .s8 .pill.main{background:var(--pink);color:#fff}

  /* S9 ぬいぐるみ(フェルト+ステッチ) */
  .s9 .mock{background:repeating-linear-gradient(45deg,var(--mint2) 0 14px,#d3efe9 14px 28px)}
  .s9 .board{background:var(--mint);border-radius:24px;border:3px dashed #fff;outline:3px solid var(--mint)}
  .s9 .key{border-radius:18px;background:#fffdf6;border:3px dashed #d8cbb0;color:#8a7a60;box-shadow:0 4px 8px rgba(0,0,0,.1)}
  .s9 .key.sel{background:var(--pink2);border-color:#fff;color:#8d2f5e}
  .s9 .panel{background:#fffdf6;border-radius:20px;border:3px dashed #d8cbb0}
  .s9 .panel label{color:#8a7a60}
  .s9 .pill{background:var(--mint);color:#3f7a72;border:2px dashed #fff}
  .s9 .pill.main{background:var(--pink);color:#fff;border:2px dashed #ffd9ea}

  /* S10 チョコミントアイス(本体ミント+チョコチップ) */
  .s10 .mock{background:var(--mint)}
  .s10 .board{background:var(--mint2);border-radius:20px;
    background-image:radial-gradient(var(--choco2) 3px,transparent 3.5px),radial-gradient(var(--choco) 2.5px,transparent 3px);
    background-size:46px 42px,34px 30px;background-position:6px 8px,20px 20px}
  .s10 .key{border-radius:12px;background:#fff;color:var(--choco);box-shadow:0 4px 0 #9fd6cc}
  .s10 .key.sel{background:linear-gradient(145deg,var(--choco2),var(--choco));color:#ffe9d2;box-shadow:0 4px 0 #3a2718}
  .s10 .panel{background:#fff;border-radius:16px;border:3px solid var(--mint)}
  .s10 .panel label{color:var(--choco)}
  .s10 .pill{background:var(--mint2);color:#3f7a72}
  .s10 .pill.main{background:var(--choco);color:#ffe9d2}
</style></head>
<body>
<h1>キーマップ着せ替え 第2弾(S6〜S10)</h1>
<div class="sub">仕組み・配置は今のまま、色と形だけ。第1弾(S1〜S5)と混ぜて選んでOK。キーはクリックで選択が動く。</div>
<div id="root"></div>
<script>
const KEYS=["Q","W","E","R","T","A","S","D","F","G","Z","X","C","V","B"];
const STYLES=[
 ["s6","S6 ふわふわ雲: 白ベースにミントの縁・選択はピンクのふちどり光"],
 ["s7","S7 ドット絵レトロ: ゲーム機っぽいカクカク立体(押した感が出る)"],
 ["s8","S8 マカロン: ミントとピンクのちどり配置・まるいお菓子キー"],
 ["s9","S9 ぬいぐるみ: フェルト+ステッチ(点線縫い目)のやわらか路線"],
 ["s10","S10 チョコミントアイス: 盤面にチョコチップが散ってる・選択キーは板チョコ"],
];
const root=document.getElementById('root');
for(const [cls,title] of STYLES){
  const set=document.createElement('div');set.className='set '+cls;
  set.innerHTML=`<h2>${title}</h2>
  <div class="mock">
    <div class="board">${KEYS.map((k,i)=>`<div class="key${i===6?' sel':''}" onclick="sel(this)">${k}</div>`).join('')}</div>
    <div class="panel">
      <div class="row"><label>えらんだキー: S</label></div>
      <div class="row"><label>動き</label><button class="pill">ふつうの文字</button><button class="pill">レイヤー</button><button class="pill">とくべつ</button></div>
      <div class="row"><button class="pill main">この文字にする</button><button class="pill">もどす</button></div>
    </div>
  </div>`;
  root.appendChild(set);
}
function sel(el){[...el.parentElement.children].forEach(k=>k.classList.remove('sel'));el.classList.add('sel');}
</script>
</body></html>
