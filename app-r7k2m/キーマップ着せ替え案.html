<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>キーマップ着せ替え5案(仕組みは今のまま)</title>
<style>
  :root{--mint:#bfe9e2;--mint2:#dff5f1;--choco:#5e3e2d;--choco2:#7a5236;--pink:#f06ba0;--pink2:#ffb3d1;--pink3:#c94f83;--gray:#9a9aa6;--gray2:#e9e9ef;--gray3:#6d6d78}
  body{margin:0;background:#f4f2f6;font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;padding:18px}
  h1{font-size:26px;color:var(--choco);margin:0 0 4px}
  .sub{font-size:16px;color:#777;margin-bottom:14px}
  .set{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:16px;margin-bottom:22px}
  .set h2{margin:0 0 10px;font-size:21px;color:var(--choco)}
  .mock{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;border-radius:14px;padding:18px}
  .board{display:grid;grid-template-columns:repeat(5,56px);gap:8px;padding:14px;border-radius:16px}
  .key{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;border-radius:12px;cursor:pointer;user-select:none}
  .panel{flex:1;min-width:240px;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .panel .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .panel label{font-size:17px;font-weight:700}
  .pill{border:0;border-radius:999px;padding:9px 18px;font-size:17px;font-weight:900;cursor:pointer}

  /* S1 チョコミント絵本(推し) */
  .s1 .mock{background:var(--mint2)}
  .s1 .board{background:#fff;box-shadow:0 6px 0 var(--mint), 0 10px 14px rgba(0,0,0,.08)}
  .s1 .key{background:linear-gradient(#fff,var(--gray2));box-shadow:0 4px 0 var(--gray);color:#555}
  .s1 .key.sel{background:linear-gradient(#ffe2ef,var(--pink2));box-shadow:0 4px 0 var(--pink3);color:#8d2f5e;transform:translateY(-2px)}
  .s1 .key .bell{position:absolute;margin:-38px 0 0 34px;font-size:14px}
  .s1 .panel{background:#fff;border:3px solid var(--mint)}
  .s1 .panel label{color:var(--choco)}
  .s1 .pill{background:var(--mint);color:var(--choco)}
  .s1 .pill.main{background:var(--pink);color:#fff}

  /* S2 キャンディポップ */
  .s2 .mock{background:linear-gradient(160deg,#ffeef6,#ffe0ee)}
  .s2 .board{background:#fff;border-radius:26px;box-shadow:0 8px 18px rgba(240,107,160,.25)}
  .s2 .key{border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 8%,var(--gray2) 60%,#d7d7de);color:#666;box-shadow:0 4px 6px rgba(0,0,0,.12)}
  .s2 .key.sel{background:radial-gradient(circle at 32% 28%,#fff 6%,var(--pink2) 55%,var(--pink));color:#fff}
  .s2 .panel{background:#fff;border-radius:24px;box-shadow:0 8px 18px rgba(240,107,160,.2)}
  .s2 .panel label{color:var(--pink3)}
  .s2 .pill{background:var(--gray2);color:#666;border-radius:999px}
  .s2 .pill.main{background:linear-gradient(#ff8ab8,var(--pink));color:#fff;box-shadow:0 4px 0 var(--pink3)}

  /* S3 クラフト紙+チョコ板 */
  .s3 .mock{background:repeating-linear-gradient(0deg,#efe3cf 0 3px,#ead9bf 3px 6px)}
  .s3 .board{background:#fff8ec;border:3px dashed var(--choco2)}
  .s3 .key{border-radius:6px;background:linear-gradient(145deg,var(--choco2),var(--choco));color:#ffe9d2;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #3a2718}
  .s3 .key.sel{background:linear-gradient(145deg,#ffd3e6,var(--pink2));color:#8d2f5e;box-shadow:0 3px 0 var(--pink3)}
  .s3 .panel{background:#fff8ec;border:3px solid var(--choco2)}
  .s3 .panel label{color:var(--choco)}
  .s3 .pill{background:var(--choco);color:#ffe9d2}
  .s3 .pill.main{background:var(--pink);color:#fff}

  /* S4 いまの灰色基調をそのまま可愛く(ルール最遵守) */
  .s4 .mock{background:#f7f5f9}
  .s4 .board{background:var(--gray2)}
  .s4 .key{border-radius:14px;background:#fff;color:#666;border:2px solid #ddd}
  .s4 .key.sel{background:var(--pink2);border-color:var(--pink);color:#8d2f5e}
  .s4 .panel{background:#fff;border:2px solid #ddd}
  .s4 .panel label{color:#555}
  .s4 .pill{background:var(--gray2);color:#555}
  .s4 .pill.main{background:var(--pink);color:#fff}

  /* S5 ゲームきしゅ風ミント */
  .s5 .mock{background:linear-gradient(180deg,var(--mint),#a9ded4)}
  .s5 .board{background:#0e3b36;border-radius:22px;box-shadow:inset 0 0 0 4px #12554d,0 8px 16px rgba(0,0,0,.25)}
  .s5 .key{border-radius:10px;background:linear-gradient(#eafffb,#bfe9e2);color:#0e3b36;box-shadow:0 3px 0 #12554d}
  .s5 .key.sel{background:linear-gradient(#ffd3e6,var(--pink2));box-shadow:0 3px 0 var(--pink3);color:#8d2f5e}
  .s5 .panel{background:#0e3b36;color:#eafffb}
  .s5 .panel label{color:#eafffb}
  .s5 .pill{background:#12554d;color:#eafffb}
  .s5 .pill.main{background:var(--pink);color:#fff}
</style></head>
<body>
<h1>キーマップ「キーを変更」着せ替え 5案</h1>
<div class="sub">仕組み・配置は今のまま。色と形だけの提案(キーはクリックで選択が動く)。番号で選んで(組み合わせ可: 「盤面はS1・パネルはS4」等)。</div>
<div id="root"></div>
<script>
const KEYS=["Q","W","E","R","T","A","S","D","F","G","Z","X","C","V","B"];
const STYLES=[
 ["s1","S1 チョコミント絵本(推し): キーはキーキャップ風の立体・選択中だけピンク"],
 ["s2","S2 キャンディポップ: 丸いアメ玉キー・ピンクの部屋"],
 ["s3","S3 クラフト紙+チョコ板: 板チョコのキーが割れてる感じ"],
 ["s4","S4 いまの灰色基調のまま角と余白だけ可愛く(一番おとなしい)"],
 ["s5","S5 ゲームきしゅ風: ミントの本体に濃い緑の盤面"],
];
const root=document.getElementById('root');
for(const [cls,title] of STYLES){
  const set=document.createElement('div');set.className='set '+cls;
  set.innerHTML=`<h2>${title}</h2>
  <div class="mock">
    <div class="board">${KEYS.map((k,i)=>`<div class="key${i===6?' sel':''}" onclick="sel(this)">${k}</div>`).join('')}</div>
    <div class="panel">
      <div class="row"><label>えらんだキー: S</label></div>
      <div class="row"><label>動き</label><button class="pill">ふつうの文字</button><button class="pill">レイヤー</button><button class="pill">とくべつ</button></div>
      <div class="row"><button class="pill main">この文字にする</button><button class="pill">もどす</button></div>
    </div>
  </div>`;
  root.appendChild(set);
}
function sel(el){
  [...el.parentElement.children].forEach(k=>k.classList.remove('sel'));
  el.classList.add('sel');
}
</script>
</body></html>
