<style>
:root{--pink:#e0197a;--pink-deep:#b81163;--pink-pale:#ffe3f0;--mint:#3ec9c2;--mint-pale:#ddf5f2;--mint-deep:#127a75;--ink:#222226;--gold:#ffd54f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--mint-pale);color:var(--ink);overflow-x:hidden;line-height:1.8;max-width:100vw}
@media(max-width:640px){.band{padding:12px 14px;gap:10px}.band .sf{font-size:30px;padding:0 10px}.band h1{font-size:24px;letter-spacing:2px}.band a{font-size:14px}
  section{padding:20px 12px}
  h2{font-size:24px}}
img{max-width:100%}
.band{background:var(--mint-deep);color:#fff;padding:22px 32px;display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}
.band .sf{font-size:56px;font-weight:900;background:#fff;color:var(--mint-deep);padding:0 20px;border-radius:10px}
.band h1{font-size:42px;font-weight:900;letter-spacing:4px}
.band a{color:#d9f4ee;font-size:20px;font-weight:900;margin-left:auto;text-decoration:none}
section{max-width:1680px;margin:0 auto;padding:36px clamp(18px,3vw,60px)}
/* あそび(絵で選ぶ。文字最少) */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;margin:0 auto}
.game{display:block;background:#fff;border:6px solid var(--pink);border-radius:32px;padding:34px 22px;text-align:center;text-decoration:none;color:var(--ink);transition:transform .15s;box-shadow:0 10px 0 rgba(184,17,99,.2)}
.game:hover{transform:translateY(-6px) rotate(-1deg)}
.game .gi{font-size:90px;line-height:1.3}
.game .gl{font-weight:900;font-size:29px;margin-top:6px}
.game.slotg{border-color:var(--gold);box-shadow:0 10px 0 rgba(201,154,30,.35)}
/* 図鑑 */
h2{font-size:35px;font-weight:900;display:inline-block;background:var(--mint-deep);color:#fff;padding:9px 30px;border-radius:10px;letter-spacing:3px}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:18px}
/* スマホは2列(58匹を1列で見るのは長すぎる。2026-08-14たけろう) */
@media(max-width:640px){.zukan{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .usagi{padding:8px;border-width:3px}
  .usagi .nm{font-size:15px}}
.usagi{background:#fff;border:5px solid var(--mint);border-radius:20px;padding:14px;text-align:center}
.usagi img{display:block}
.usagi .nm{font-size:20px;font-weight:900}
.usagi .stmp{font-size:18px;color:var(--pink-deep);font-weight:900}
footer{background:var(--mint-deep);color:#fff;text-align:center;padding:24px;font-size:20px;letter-spacing:1px}
footer a{color:#d9f4ee}

/* ===== クリィミーマミ配色(2026-08-15全ページ統一)。旧値: pink#e0197a/deep#b81163/mint#3ec9c2/mint-deep#127a75 ===== */
:root{
  --pink:#ee85b5; --pink-deep:#c9679c; --pink-pale:#fbe7f1;
  --mint:#9dd8c8; --mint-pale:#eef8f3; --mint-deep:#6a9fc0;
  --gold:#f2d98a;
}

/* 80年代セル画パステル(2026-08-15) */
body{background:#e9f2f8}
.usagi{background:#fdf3e7}

/* 80sマミ強化: 帯を虹パステルグラデに(2026-08-15) */
.band{background:linear-gradient(90deg,#b79ce0,#ee85b5 45%,#8ec5e8) !important}
</style>
</head>
<body>
<div class="band"><a class="sf" href="index.html?in=1" style="text-decoration:none;cursor:pointer;margin-left:0" title="お店にもどる">🐰</a><h1>うさぎずかん</h1><a href="index.html?in=1">◀ お店にもどる</a></div>

<section>
  <div style="font-size:26px;font-weight:900;color:#127a75;margin-bottom:2px">ばつべーは おしゃれずき。きょうは どの コーデに あえるかな</div>
  <div id="zkcount" style="font-size:34px;font-weight:900;color:#e0197a;margin-bottom:10px"></div>
  <div class="zukan" id="zukan"></div>
  <div style="font-size:18px;font-weight:900;color:#4a4450;margin-top:14px">🔮 ガチャや 🎰 スロットで あたらしい コーデに であえるよ</div>
  <div style="font-size:14px;font-weight:700;color:#6b6672;margin-top:16px;background:#fff;border-radius:12px;padding:12px 16px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.9">
    ⚠️ あつめた コーデと コインは、<b>いま つかっている ブラウザの なか</b>に ほぞんされているよ。<br>
    ブラウザの りれき(サイトデータ)を けすと <b>きえちゃう</b>から きをつけてね。<br>
    スマホと パソコンでは べつべつに かぞえるよ。
  </div>
</section>

<footer>ちびボード / <a href="index.html?in=1">お店にもどる</a></footer>

<script>
/* ずかん=コレクション(2026-08-14作り替え)。ガチャ・スロットで出会った子が埋まっていく。
   もっていない子はシルエット。プールの正本は asobi_common.js の CHIBI.ALL */
const C = window.CHIBI;
const owned = new Set(C.getZukan());
document.getElementById('zkcount').textContent = `みつけた コーデ: ${[...owned].filter(id=>C.ALL.includes(id)).length} / ${C.ALL.length}`;
/* あご基準レイアウト: 顔の下端(あご)を全カード同じ高さに固定。
   同一素体なので耳も自動で揃う。枠は最大にはみ出す子(帽子の上・長いネックレス)が入るよう自動計算 */
const K = (window.USAGI_FIT && USAGI_FIT._K) || 1.768;
const fitOf = id => {
  let f = (window.USAGI_FIT && USAGI_FIT[id]) || null;
  if(!f || !f.fw) f = {fw:.70, cx:.5, ar:1.5, ty:.05};
  if(f.fw < 0.3){ f = {fw:.70, cx:.5, ar:f.ar||1.5, ty:(f.ty!=null?f.ty:.05)}; }
  if(f.by == null || f.by <= f.ty + 0.1) f.by = f.ty + K * f.fw / f.ar;
  return f;
};
let U=0, D=0, L=0, R=0;
C.ALL.forEach(id=>{
  const f = fitOf(id);
  U = Math.max(U, (f.by - (f.ty||0.05)) * f.ar / f.fw);   // あご→頭頂
  D = Math.max(D, (1 - f.by) * f.ar / f.fw);              // あご→下端
  L = Math.max(L, f.cx / f.fw);
  R = Math.max(R, (1 - f.cx) / f.fw);
});
const faceW = Math.min(100/(L+R), 100/(U+D)) * 0.97;
const CHIN = U * faceW + (100 - (U+D)*faceW)/2;
const centerX = 50 + (L - (L+R)/2) * faceW;
document.getElementById('zukan').innerHTML = C.ALL.map((id,i)=>{
  const no = String(i+1).padStart(2,'0');
  const has = owned.has(id);
  const f = fitOf(id);
  const Wp = faceW / f.fw;
  const Lp = centerX - f.cx * Wp;
  const Tp = CHIN - f.by * Wp * f.ar;
  if(!has){
    /* 未入手は形が一切わからない「?」カードにする(シルエット禁止。2026-08-15依頼主指示) */
    return `<div class="usagi" style="background:#eef4f3">
      <div style="position:relative;width:100%;aspect-ratio:1;overflow:hidden;display:flex;align-items:center;justify-content:center">
        <span style="font-size:44px;font-weight:900;color:#b9c6c3">?</span>
      </div>
      <div class="nm">?</div></div>`;
  }
  return `<div class="usagi">
    <div style="position:relative;width:100%;aspect-ratio:1;overflow:hidden">
      <img src="../img/usagi/${id}.png" alt="No.${no}"
        style="position:absolute;width:${Wp.toFixed(1)}%;left:${Lp.toFixed(1)}%;top:${Tp.toFixed(1)}%">
    </div>
    <div class="nm">No.${no}</div></div>`;
}).join('');
</script>
<div style="position:fixed;left:8px;bottom:8px;z-index:9999;background:#000c;color:#fff;font:700 13px/1.6 sans-serif;padding:4px 12px;border-radius:99px;pointer-events:none" id="verbadge"></div>
<script>if(['localhost','127.0.0.1'].includes(location.hostname)){document.getElementById('verbadge').textContent='版: '+new Date(document.lastModified).toLocaleString('ja-JP');}else{document.getElementById('verbadge').remove();}</script>
</body>
