<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ちびガチャ — まわして ばつべー!</title>
<script src="asobi_common.js"></script>
<style>
/* 2026-08-15 スマホ対策: 下引っ張り更新リセット+画像ドラッグ防止 */
html,body{overscroll-behavior-y:contain}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

:root{--pink:#e84898;--pink-deep:#e0197a;--mint:#5fd6c4;--gold:#ffd54f;--gold-deep:#c99a1e;--ink:#3a2233}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;background:#180a14;color:#fff;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:1.2dvh 12px;user-select:none;overflow:hidden}
h1{font-size:clamp(16px,4dvh,34px);letter-spacing:4px;color:var(--mint);margin:0 0 .4dvh;flex:0 0 auto}
.fuda{background:#fff;color:var(--ink);border-radius:18px;padding:14px 30px;font-size:24px;font-weight:900;line-height:2.1;margin:10px 0;border-left:6px solid var(--mint);text-align:center}
.fuda b{color:var(--pink-deep);font-size:30px}
/* 2026-08-20: 旧.coin(角丸バー)は撤去。コインは丸い金貨GUI(.chibiCoinGui、asobi_common.js)に統一 */
/* 2026-08-21: 1画面化のため上部を横並びバーに(戻る/コイン/ひみつ)。flex:0 0 auto */
.topbar{flex:0 0 auto;width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:.4dvh}
.topbar .coin{flex:0 0 auto}
#fxbtn{background:#3a2233;color:#ffd54f;border:3px solid #5a4030;border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(12px,2dvh,18px);cursor:pointer;font-family:inherit;flex:0 0 auto;white-space:nowrap}

/* ===== ガチャマシン(1画面フィット・vh基準) ===== */
.machine{width:min(80dvh,92vw,460px);text-align:center;user-select:none;margin:0;position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dome{width:min(56dvh,80vw,420px);height:min(56dvh,80vw,420px);margin:0 auto;border-radius:50%;background:radial-gradient(circle at 32% 30%, #ffffffcc, #ffffff22 55%), #ffe3f0;border:10px solid var(--pink);position:relative;overflow:hidden;box-shadow:0 0 30px rgba(232,72,152,.25)}
.dome .mini{position:absolute;width:21%;height:21%;border-radius:50%;box-shadow:inset -6px -8px 12px rgba(0,0,0,.18), inset 5px 6px 10px rgba(255,255,255,.7)}
.machine.excited .dome{box-shadow:0 0 46px 10px rgba(255,213,79,.55)}
.body2{width:min(46dvh,68vw,350px);height:min(26dvh,39vw,200px);margin:-10px auto 0;background:var(--pink);border-radius:16px;position:relative;border:8px solid var(--pink-deep);border-top:none;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.hnd{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(15dvh,23vw,120px);height:min(15dvh,23vw,120px);border-radius:50%;background:#fff;border:8px solid var(--pink-deep);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(14px,2.6dvh,26px);color:var(--pink-deep);cursor:pointer;transition:transform .9s cubic-bezier(.5,0,.4,1);animation:hndinvite 1.8s ease-in-out infinite}
@keyframes hndinvite{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(14deg)}}
.hnd::before{content:"";position:absolute;width:14px;height:95px;background:var(--pink-deep);border-radius:5px;opacity:.25}
.hnd span{position:relative;z-index:2}
/* 👉で視線誘導(回せる時だけ) */
.body2::before{content:"👉";position:absolute;left:-92px;top:52px;font-size:64px;z-index:5;animation:pointat2 .9s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
@keyframes pointat2{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.body2:has(.hnd.disabled)::before,.body2:has(.hnd.spin)::before{display:none}
.hnd.spin{animation:none;transform:translateX(-50%) rotate(540deg)}
.hnd.disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed;animation:none}
.slotmouth{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:130px;height:46px;background:#3a1128;border-radius:10px;box-shadow:inset 0 4px 8px #000}
.machine.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* 2026-08-21: 回した瞬間に画面を暗転気味にして集中させる(machineの震え中に先出し) */
#predim{position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none;transition:opacity .5s ease-in}
#predim.go{opacity:.55}

/* ===== 演出オーバーレイ(カプセル落下→開封) ===== */
#reveal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(40,16,32,.94);overflow:hidden}
#reveal .inner{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.capsule2{position:absolute;left:50%;top:-200px;width:190px;height:190px;margin-left:-95px;z-index:3}
.capsule2 .top{position:absolute;inset:0 0 50% 0;border-radius:130px 130px 0 0;transition:transform .45s cubic-bezier(.6,-.3,.7,1)}
.capsule2 .btm{position:absolute;inset:50% 0 0 0;background:#fff;border-radius:0 0 130px 130px;transition:transform .45s cubic-bezier(.6,-.3,.7,1)}
.capsule2.c-normal .top{background:var(--pink)}
.capsule2.c-gold .top{background:linear-gradient(160deg,#fff2b8,var(--gold) 45%,var(--gold-deep));box-shadow:0 0 40px 8px rgba(255,213,79,.8)}
.capsule2.c-gold .btm{background:#fff8dd}
.capsule2.c-rainbow .top{background:linear-gradient(90deg,#ff5f8f,#ffb347,#ffe95f,#7ee787,#5fd6ff,#b18bff);background-size:600% 100%;animation:rbw 1.2s linear infinite;box-shadow:0 0 55px 14px rgba(255,255,255,.75)}
.capsule2.c-rainbow .btm{background:#fff}
@keyframes rbw{to{background-position:600% 0}}
.capsule2.drop{animation:fall .9s cubic-bezier(.3,0,.6,1) forwards}
@keyframes fall{0%{top:-200px}55%{top:calc(50% - 95px)}70%{top:calc(50% - 190px)}85%{top:calc(50% - 95px)}94%{top:calc(50% - 128px)}100%{top:calc(50% - 95px)}}
.capsule2.wobble{animation:wob .5s .1s 2}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
/* 2026-08-21: ハズレのタメは控えめに震える(当たりとの対比) */
.capsule2.wobble-lite{animation:wob-lite .6s .1s 2}
@keyframes wob-lite{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
/* 2026-08-21 実測バグ修正: .wobble/.revive の animation(transform用)がshorthandごと
   .drop の animation(top用のfall)を上書きし、forwardsで止めていたtopが基準値(-200px)に
   戻って画面外へ消えていた(2クラス同士のanimationプロパティ競合)。
   → 着地位置は.top(animation)ではなく.landed(静的な値・優先度は2クラスで.capsule2単体より高い)
   で固定し、以後どのanimationクラスが乗ってもtopは動かないようにする */
.capsule2.landed{top:calc(50% - 95px)}
.capsule2.revive{animation:revive .8s ease-in-out 2}
@keyframes revive{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-14px) rotate(-10deg)}50%{transform:translateY(0) rotate(8deg)}70%{transform:translateY(-20px) rotate(-6deg)}}

/* 2026-08-21: 着地の影(バウンドに合わせて伸縮・薄くなる) */
.capsule2 .cshadow{position:absolute;left:50%;bottom:-16px;width:170px;height:34px;margin-left:-85px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%);opacity:0;z-index:1;transition:none}
.capsule2.drop .cshadow{animation:cshadowfall .9s cubic-bezier(.3,0,.6,1) forwards}
@keyframes cshadowfall{0%{opacity:0;transform:scale(.3)}55%{opacity:.9;transform:scale(1)}70%{opacity:.4;transform:scale(.55)}85%{opacity:.85;transform:scale(.95)}94%{opacity:.55;transform:scale(.7)}100%{opacity:.85;transform:scale(1)}}

/* 2026-08-21: タメ中に割れ目から光が漏れる(レア度でトーン変化)。JSがCSS変数--leakでいろを渡す */
.capsule2 .leak{position:absolute;inset:-6px;border-radius:130px;opacity:0;pointer-events:none;z-index:4;background:radial-gradient(circle at 50% 55%, var(--leak,#fff) 0%, transparent 62%);filter:blur(2px)}
.capsule2 .leak.go{animation:leakpulse 1.1s ease-in-out infinite}
@keyframes leakpulse{0%,100%{opacity:.15}50%{opacity:.75}}
.capsule2 .leak.hot{animation-duration:.55s}
.capsule2 .leak.rainbow{background:conic-gradient(from 0deg, #ff5f8f,#ffb347,#ffe95f,#7ee787,#5fd6ff,#b18bff,#ff5f8f);animation:leakpulse .5s ease-in-out infinite, leakspin 2s linear infinite}
@keyframes leakspin{to{transform:rotate(360deg)}}
/* 2026-08-21: ハズレは光漏れをごく弱く(期待の温度を下げる) */
.capsule2 .leak.go.weak{animation:leakpulseweak 1.6s ease-in-out infinite}
@keyframes leakpulseweak{0%,100%{opacity:.04}50%{opacity:.16}}

/* 2026-08-21: ハズレ専用「ぽすっ」開封(フラッシュなし・力なく開いて空っぽの下半分が残る) */
.capsule2.openweak .top{transform:translateY(-42px) rotate(-15deg);transition:transform .55s cubic-bezier(.3,.7,.4,1)}
.capsule2.openweak .btm{transition:none}
/* 中から灰色の煙がぽふっと出て消える */
.capsule2 .smoke{position:absolute;left:50%;top:30%;width:25%;height:25%;margin-left:-12.5%;border-radius:50%;background:radial-gradient(circle at 38% 35%,#eaeaea,#8f8f8f 72%);opacity:0;pointer-events:none;z-index:6}
.capsule2 .smoke.go{animation:smokego .9s ease-out forwards}
@keyframes smokego{0%{opacity:0;transform:scale(.3) translateY(0)}25%{opacity:.9;transform:scale(1) translateY(-8px)}100%{opacity:0;transform:scale(2) translateY(-90px)}}

/* ✨ 色の昇格(2026-08-19): 白フラッシュ→色がわり→ぐぐっと拡大→おちつく */
.capsule2.upgrading{animation:upgpulse .5s ease-in-out}
@keyframes upgpulse{0%{transform:scale(1)}40%{transform:scale(1.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.capsule2 .upflash{position:absolute;inset:-10px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;z-index:4}
.capsule2 .upflash.go{animation:upflashgo .35s}
@keyframes upflashgo{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.ringpulse{position:absolute;left:50%;top:50%;width:260px;height:260px;border-radius:50%;padding:6px;background:linear-gradient(90deg,#ff5f8f,#ffb347,#ffe95f,#7ee787,#5fd6ff,#b18bff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;pointer-events:none;z-index:2}
.ringpulse.go{animation:ringpulsego 1s ease-out}
@keyframes ringpulsego{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
#rin.shakelite{animation:shakelite .4s}
@keyframes shakelite{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 💥 ヒビで止まる(2026-08-19): カプセルにヒビ→静止→はじける */
.crack{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:5;transition:opacity .1s}
.crack.go{opacity:1}
.crack svg{width:100%;height:100%}
.crack path{stroke:#3a2233;stroke-width:5;fill:none;stroke-linecap:round}
.capsule2.open .top{transform:translate(-75px,-180px) rotate(-75deg);transition:transform .7s cubic-bezier(.2,.7,.4,1),opacity .5s .5s;opacity:0}
.capsule2.open .btm{transform:translate(75px,180px) rotate(70deg);transition:transform .7s cubic-bezier(.2,.7,.4,1),opacity .5s .5s;opacity:0}
/* 割れの瞬間: 中身が小さく飛び出て弾みながら等倍に(2026-08-17。全体1.2〜1.6秒でカプセル→中身→きらきらの3段) */
.prize img.pz{transform:scale(.15);opacity:0;transition:none}
.prize.go img.pz{animation:przpop .7s .18s cubic-bezier(.3,1.8,.4,1) forwards}
@keyframes przpop{0%{transform:scale(.15);opacity:0}60%{transform:scale(1.2);opacity:1}80%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
/* きらきら破片(2026-08-17) */
.spark{position:absolute;left:50%;top:50%;width:14px;height:14px;pointer-events:none;z-index:7}
.spark.star::before{content:"✨";font-size:22px;position:absolute;left:-11px;top:-11px}
.spark.dot{border-radius:50%;background:var(--gold)}
@keyframes sparkfly{0%{transform:translate(-50%,-50%) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:fl .5s}
@keyframes fl{10%{opacity:1}100%{opacity:0}}
.rays{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;opacity:0;background:repeating-conic-gradient(var(--pink) 0 9deg, transparent 9deg 18deg);border-radius:50%}
.rays.go{opacity:.35;animation:rot 14s linear infinite}
.rays.goldrays{background:repeating-conic-gradient(var(--gold) 0 9deg, transparent 9deg 18deg)}
@keyframes rot{to{transform:rotate(360deg)}}
.prize{position:relative;text-align:center;opacity:0;transform:scale(.3);transition:all .5s cubic-bezier(.2,1.5,.4,1);z-index:6}
.prize.go{opacity:1;transform:scale(1)}
/* 2026-08-21: ハズレ結果は明るい画面+しょんぼり揺れで大きく登場(当たりとの対比をはっきりさせる) */
#reveal.bright{background:rgba(255,244,232,.97);transition:background .4s}
.prize.miss .name{color:var(--ink);font-size:clamp(44px,13dvh,110px);letter-spacing:2px}
.prize.miss.go{animation:shonbori .65s cubic-bezier(.3,1.4,.4,1) forwards}
@keyframes shonbori{0%{opacity:0;transform:scale(.35) rotate(0)}45%{opacity:1;transform:scale(1.08) rotate(-7deg)}65%{transform:scale(.94) rotate(5deg)}82%{transform:scale(1.03) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.prize.miss .go-btn{margin-top:26px}
.prize img.pz{width:120px;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35));display:block;margin:0 auto}
.prize .name{font-size:36px;font-weight:900;color:#fff;letter-spacing:2px;margin-top:6px}
.prize .keybox2{font-size:26px;letter-spacing:4px;background:#10302e;color:var(--gold);border-radius:10px;padding:7px 14px;margin:8px auto 0;width:fit-content;font-weight:900}
.prize .note2{font-size:17px;color:#ffe;margin-top:10px;line-height:1.9;font-weight:700}
.prize .go-btn{display:inline-block;margin-top:20px;background:var(--pink);color:#fff;font-weight:900;font-size:26px;border-radius:12px;padding:13px 30px;cursor:pointer;border:0;border-bottom:6px solid var(--pink-deep);font-family:inherit}
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:130;animation:conf 2.6s linear forwards;pointer-events:none}
.confetti.big{width:16px;height:22px}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}
#flashfx{position:fixed;inset:0;background:#fff;z-index:140;pointer-events:none;opacity:0;animation:ffx 1.3s}
@keyframes ffx{6%{opacity:1}14%{opacity:0}22%{opacity:.9}32%{opacity:0}42%{opacity:.7}60%{opacity:0}}
#msg{flex:0 0 auto;min-height:1.6em;text-align:center;font-weight:900;font-size:clamp(12px,2.4dvh,23px);margin-top:.4dvh}
#msg.nudge{animation:msgnudge .8s ease-in-out 3}
@keyframes msgnudge{0%,100%{transform:scale(1)}50%{transform:scale(1.18);color:var(--gold)}}
.links{flex:0 0 auto;margin-top:.3dvh;font-size:11px;color:#8d7f89}
.links a{color:#8d7f89}
/* お店にもどる: 必ず目に入るボタン(2026-08-17)。2026-08-21: 1画面化で上部バーの小型ボタンに変更 */
.backbtn{display:block;background:var(--mint);color:var(--ink);text-decoration:none;text-align:center;font-weight:900;font-size:clamp(11px,2dvh,16px);border-radius:999px;padding:6px 14px;border-bottom:4px solid var(--gold-deep);box-shadow:0 3px 8px rgba(0,0,0,.35);flex:0 0 auto;white-space:nowrap}
/* 演出のひみつ */
#fxov{position:fixed;inset:0;background:rgba(13,6,11,.85);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
#fxov.show{display:flex}
.fxbox{background:#fff;color:var(--ink);border:6px solid var(--gold);border-radius:28px;padding:34px 40px;max-width:720px;width:100%;font-weight:900}
.fxbox h3{color:#8a6a10;letter-spacing:4px;font-size:32px;text-align:center;margin-bottom:12px}
.fxbox .row{display:flex;justify-content:space-between;border-bottom:3px solid #f0e8d0;padding:15px 4px;font-size:25px}
.fxbox .row b{color:var(--pink-deep)}
.fxbox .foot{font-size:19px;margin-top:10px;color:#5a4a30;text-align:center;font-weight:700}

/* 2026-08-20: dev演出プレビュー(?dev=1専用・本番非表示)。店のコインdevパネルは左上のため右下は空き */
#devpanel{position:fixed;right:8px;bottom:8px;z-index:220;background:rgba(20,10,18,.94);border:2px solid var(--gold);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#devpanel .devtitle{grid-column:1/-1;color:var(--gold);font-size:11px;font-weight:900;text-align:center;margin-bottom:2px;letter-spacing:1px}
#devpanel button{font-size:11px;font-weight:700;padding:6px 4px;border-radius:6px;border:1px solid #5a4030;background:#3a2233;color:#fff;cursor:pointer;font-family:inherit}
#devpanel button:active{background:var(--pink)}

/* 🪙0枚の絵で伝える(文字なし)。空表示は.chibiCoinGui.emptyが担当(グレー+数字赤) */
#nocoin{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none}
#nocoin.go{display:flex}
#nocoin .stamp{position:relative;font-size:190px;line-height:1;filter:grayscale(1);animation:ncpop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes ncpop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.25);opacity:1}45%{transform:scale(1)}60%{transform:translateX(-14px)}70%{transform:translateX(12px)}80%{transform:translateX(-8px)}90%{transform:translateX(6px)}100%{transform:translateX(0)}}

/* ===== クリィミーマミ差し色(2026-08-15)。舞台の闇はそのまま、差し色だけパステルに。旧値: pink#e84898/deep#e0197a/mint#5fd6c4/gold#ffd54f ===== */
:root{
  --pink:#f096bd; --pink-deep:#d873a5;
  --mint:#a8e0cc; --gold:#f2d98a; --gold-deep:#d9b95e;
}

/* 👉指差しをマミ色に(2026-08-15) */
.lever-rail::before, .body2::before{filter:sepia(1) saturate(2.2) hue-rotate(295deg) brightness(1.08) drop-shadow(0 3px 5px rgba(0,0,0,.4)) !important}

/* ===== 左端クリップ対策+スマホ縮小(2026-08-15)。
   原因: .machine(460px)/.dome(420px)/.body2(350px)が固定pxで375px幅を超え、
   body{align-items:center}の中央寄せではみ出た左側がscrollLeftで届かず切れて見えていた。
   抽選ロジックは無関係、サイズをvw基準に変えるだけ ===== */
html,body{overflow-x:hidden}
@media (max-width:640px){
  body{padding:1dvh 8px}
  h1{letter-spacing:2px;white-space:nowrap}
  .fuda{padding:8px 12px;font-size:13px;line-height:1.6;margin:6px 0;border-radius:12px}
  .fuda b{font-size:15px}
  .hnd::before{width:9px;height:60px}
  .body2::before{font-size:32px;left:-38px;top:34px}
  .slotmouth{width:34%;height:24px;bottom:8px}
  .fxbox{padding:20px 16px}
  .fxbox h3{font-size:20px;margin-bottom:8px}
  .fxbox .row{font-size:14px;padding:9px 2px}
  .fxbox .foot{font-size:12px;margin-top:6px}
  .prize img.pz{width:26vw;max-width:96px}
  .prize .name{font-size:24px}
  .prize .keybox2{font-size:18px}
  .prize .note2{font-size:13px}
  .prize .go-btn{font-size:18px;padding:10px 20px}
}

</style>
</head>
<body>
<div id="nocoin"><div class="stamp"><span class="c">🪙</span></div></div>
<div id="predim"></div>

<h1>🔮 ちびガチャ</h1>
<div class="topbar">
  <a class="backbtn" href="shop/index.html?in=1">お店にもどる</a>
  <div class="coin" id="status"></div>
  <button id="fxbtn">❔ 演出のひみつ</button>
</div>

<div class="machine" id="machine">
  <div class="dome" id="dome"></div>
  <div class="body2"><div class="hnd" id="hnd">まわす!</div><div class="slotmouth"></div></div>
</div>

<div id="reveal"><div class="inner" id="rin"></div></div>
<div id="fxov"><div class="fxbox">
  <h3>— 演出のひみつ —</h3>
  <div class="row"><span>🟡 金カプセル</span><b>🎁 1/5</b></div>
  <div class="row"><span>🌈 虹カプセル</span><b>🎁 かくてい!</b></div>
  <div class="row"><span>💫 ハズレが ふるえだしたら…</span><b>ふっかつ!</b></div>
  <div class="row"><span>✨ いろが かわる</span><b>アツい!</b></div>
  <div class="row"><span>💥 ヒビが はいる</span><b>アツい!</b></div>
  <div class="foot">金・虹が出たら <b>大あたり かくてい</b>🐰</div>
  <div class="foot" style="margin-top:16px;opacity:.55;font-size:12px">ガチャ 新台 v2.4 (2026-08-21)</div>
</div></div>

<script>
/* ============================================================
   ちびガチャ新台(2026-08-14: 宝箱3択方式に作り替え)
   コイン1枚=1回 / 大当たり=1/100(C.P_WIN)→🎁宝箱3択(95%うさぎ・5%ひみつのコマンド券)
   小当たりは廃止。ずかん入手経路は宝箱だけ。鍵はゲームから出さない(手配りのみ)。
   カプセル色=大当たりの予告演出(金=1/5・虹=確定・復活あり)。総確率は不変。
   ⚠当たり判定はいずれCloudflare Workersへ移す(この版は演出確認用モック)
   ============================================================ */
const C = window.CHIBI;
const $ = id => document.getElementById(id);

/* ===== 音(スロットと同系。Web Audio自作) ===== */
let AC, MASTER;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-28; comp.knee.value=8; comp.ratio.value=14;
  comp.attack.value=0.008; comp.release.value=0.18;
  MASTER=AC.createGain(); MASTER.gain.value=1.6; MASTER.connect(comp); comp.connect(AC.destination);} return AC; }
function out(){ ac(); return MASTER; }
function tone(f,t0,dur,type,gain,slide){ const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime+t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+t0+dur);
  g.gain.setValueAtTime(gain||0.15,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  o.connect(g); g.connect(out()); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+dur+0.05); }
function knock(t0,dur,freq,gain){ const a=ac(),len=a.sampleRate*dur,buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=2.5;
  const g=a.createGain(); g.gain.setValueAtTime(gain,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t0+dur);
  s.connect(f); f.connect(g); g.connect(out()); s.start(a.currentTime+t0); }
function bomb(){ const a=ac(); const bg=a.createGain(); bg.gain.value=2.8; bg.connect(a.destination);
  const len=a.sampleRate*0.06,buf=a.createBuffer(1,len,a.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,0.5);
  const s=a.createBufferSource(); s.buffer=buf; const ng=a.createGain(); ng.gain.value=1.6; s.connect(ng); ng.connect(bg); s.start();
  [26,29,32,35,38,42,46,50,55,60].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f*2.2,a.currentTime); o.frequency.exponentialRampToValueAtTime(f,a.currentTime+0.08);
    g.gain.setValueAtTime(1.0,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+1.1-i*0.04);
    o.connect(g); g.connect(bg); o.start(); o.stop(a.currentTime+1.2); });
  [70,80,90,100,115,130].forEach(f=>{ const o=a.createOscillator(),g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f*1.8,a.currentTime); o.frequency.exponentialRampToValueAtTime(f*0.7,a.currentTime+0.25);
    g.gain.setValueAtTime(0.9,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.4);
    o.connect(g); g.connect(bg); o.start(); o.stop(a.currentTime+0.5); }); }
function sndHandle(){ knock(0,0.1,500,0.8); tone(180,0.05,0.3,'square',0.12); knock(0.35,0.08,600,0.6); }
function sndDrop(){ tone(500,0,0.1,'sine',0.2,180); knock(0.42,0.15,350,1.2); }
function sndWin(){ bomb();
  [34,37,40,43,46,50,54,58,63,68].forEach((f,i)=>tone(f,0,0.9-i*0.03,'sine',0.55,f*0.82));
  knock(0,0.25,240,1.4); knock(0,0.22,520,1.4);
  [1109,1333,1479,1733,1976,2217,2489,2794].forEach((f,i)=>tone(f,0.015,0.8-i*0.05,'triangle',0.22-i*0.015));
  [4186,4699,5274,5920].forEach((f,i)=>tone(f,0.05+i*0.03,0.5,'sine',0.08)); }
function sndJackpot(){ sndWin();
  setTimeout(()=>{ bomb(); [28,31,34,38,42].forEach((f,i)=>tone(f,0,1.4-i*0.05,'sine',0.6,f*0.85)); }, 260);
  setTimeout(()=>{ knock(0,0.35,300,1.5); [1976,2489,2960].forEach((f,i)=>tone(f,0,1.2,'triangle',0.14-i*0.03)); }, 550); }
function sndKyuin(){ tone(1500,0,0.22,'square',0.3,4800); tone(2200,0.02,0.16,'sine',0.16,5600); }
function sndMiss(){ tone(220,0,0.15,'sine',0.12,180) }
/* 2026-08-21: からっぽ結果を伝える低く短い「ぽふ」音 */
function sndPofu(){ knock(0,0.16,220,1.0); tone(140,0.02,0.22,'sine',0.18,90); }
function screenFlash(){ const f=document.createElement('div'); f.id='flashfx'; document.body.appendChild(f); setTimeout(()=>f.remove(),1400); }
function confetti(){ const cols=['#e84898','#5fd6c4','#ffd54f','#fff'];
  for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%4]; c.style.animationDelay=(Math.random()*0.7)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3600); } }
/* 2026-08-19: ヒビ割れバースト用の大粒コンフェッティ(最低30個) */
function confettiBig(n){ const cols=['#e84898','#5fd6c4','#ffd54f','#fff','#b18bff'];
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='confetti big';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length]; c.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3600); } }
/* 2026-08-19: 昇格の「キュイーン」(上昇音) */
function sndKyuinUp(){ knock(0,0.08,700,0.7); tone(900,0,0.28,'sawtooth',0.22,3200); tone(1400,0.03,0.22,'sine',0.18,4200); }
/* 2026-08-19: ヒビ「ピシッ」 */
function sndCrack(){ knock(0,0.1,1500,1.1); tone(2200,0,0.06,'square',0.14,700); }
/* 2026-08-19: バースト「パカーン」(ジャックポット音より一段強い) */
function sndBurst(){ sndJackpot(); knock(0,0.3,260,1.9); }

/* ===== ドームの中のカプセル ===== */
(function(){ const d=$('dome'); const cols=['#e84898','#5fd6c4','#ffd54f','#fff','#e0197a','#b18bff'];
  for(let i=0;i<14;i++){ const m=document.createElement('div'); m.className='mini';
    m.style.background='radial-gradient(circle at 32% 28%, #ffffffb0, transparent 55%),'+cols[i%cols.length];
    m.style.left=(10+Math.random()*310)+'px'; m.style.top=(180+Math.random()*180)+'px'; d.appendChild(m); } })();
$('fxbtn').onclick=()=>$('fxov').classList.add('show');
$('fxov').onclick=e=>{ if(e.target.id==='fxov') e.currentTarget.classList.remove('show'); };

let spinning=false;
/* 2026-08-20: コイン表示は丸い金貨GUI(asobi_common.js)に統一 */
/* 2026-08-21: 1画面化で上部バーに収まる小型サイズに(note非表示で高さ節約) */
if(C){ C.mountCoinGui($('status'), {size:64, note:false}); }
function refresh(spin){
  if(!C){ $('status').textContent='🪙 —'; return; }
  C.refreshCoinGui(!!spin);
  const dead = spinning || C.getCoins()<1;
  $('hnd').classList.toggle('disabled', dead);
  if(!spinning && C.getCoins()<1) $('msg').innerHTML='<a href="shop/index.html?in=1" style="color:#5fd6c4">お店のばつべー</a>と あそんで 🪙をゲット';
  else if(!spinning) $('msg').textContent='';
}
refresh();

/* ============================================================
   2026-08-20: 抽選〜演出の本体をspin(opts)に切り出し。
   opts省略時(通常プレイ)は以前とビットレベルで同じ処理順・同じ乱数呼び出し順=当選確率は不変。
   opts.preview=trueの時だけ: コインを使わない/C.setAtari等の実キー発行(宝箱)を呼ばない。
   opts.forceBig / forceColor / forceRevive / forceStartColor / forceUpgradeSteps / forceDoCrack で
   devパネルから演出だけを強制表示できる(下のDEV_PREVIEW_ENABLEDブロック参照)。
   ============================================================ */
function spin(opts){
  opts = opts || {};
  const preview = !!opts.preview;
  if(spinning) return;
  if(!preview && C && C.getCoins()<1){
    refresh();
    const nc=document.getElementById('nocoin'); nc.classList.remove('go'); void nc.offsetWidth; nc.classList.add('go'); setTimeout(()=>nc.classList.remove('go'),1300);
    return;
  }
  spinning=true;
  if(!preview){ if(C) C.spendCoin(); refresh(true); }
  $('machine').classList.remove('excited');
  $('hnd').classList.add('spin');
  $('machine').classList.add('shake');
  /* 2026-08-21: 回した瞬間に暗転気味へ(集中させる演出) */
  $('predim').classList.add('go');
  sndHandle();

  /* --- 抽選(モック): 大当たりのみ(1/100)。それ以外はハズレ --- */
  const big = ('forceBig' in opts) ? !!opts.forceBig : (C ? C.drawPriority() : (Math.random()<0.01));
  /* カプセル色: 虹=確定 / 金=出たら大当たり確定・1/5 / 復活=通常色→震えて当たり */
  let color='normal', revive=false;
  if('forceColor' in opts){
    color = opts.forceColor; revive = !!opts.forceRevive;
  } else if(big){
    const t=Math.random(); if(t<0.2) color='rainbow'; else if(t<0.85) color='gold'; else {color='normal'; revive=true;}
  }

  /* 2026-08-19: 色の昇格(演出のみ・当選確率には無関係)。最終色は上のcolorのまま変わらない */
  let startColor=color, upgradeSteps=[];
  if('forceStartColor' in opts){
    startColor = opts.forceStartColor; upgradeSteps = opts.forceUpgradeSteps || [];
  } else {
    if(color==='gold' && Math.random()<0.5){ startColor='normal'; upgradeSteps=['gold']; }
    if(color==='rainbow' && Math.random()<0.7){
      if(Math.random()<0.5){ startColor='normal'; upgradeSteps=['gold','rainbow']; }
      else { startColor='gold'; upgradeSteps=['rainbow']; }
    }
  }
  /* 2026-08-19: ヒビで止まる。金・虹は必ず、復活は3割 */
  const doCrack = ('forceDoCrack' in opts) ? !!opts.forceDoCrack : ((color==='gold' || color==='rainbow') || (revive && Math.random()<0.3));

  setTimeout(()=>{ $('machine').classList.remove('shake'); startReveal(); }, 1200);

  function startReveal(){
    const reveal=$('reveal'), rin=$('rin');
    reveal.style.display='flex';
    rin.innerHTML=`<div class="rays ${color==='gold'||color==='rainbow'?'goldrays':''}" id="rays"></div>
      <div class="flash" id="flash"></div>
      <div class="ringpulse" id="ringpulse"></div>
      <div class="capsule2 c-${startColor}" id="cap"><div class="cshadow"></div><div class="top"></div><div class="btm"></div>
        <div class="leak" id="leak"></div>
        <div class="smoke" id="smoke"></div>
        <div class="upflash" id="upflash"></div>
        <div class="crack" id="crack"><svg viewBox="0 0 190 190"><path d="M60 8 L88 68 L54 96 L108 182"/><path d="M88 68 L130 90"/></svg></div>
      </div>
      <div class="prize" id="prz"></div>`;
    const cap=$('cap');
    /* 2026-08-21: 着地したら暗転オーバーレイは静かに退避(#revealの暗さに引き継ぐ) */
    $('predim').classList.remove('go');
    sndDrop();
    /* 2026-08-21: landedは静的な着地top値。fallアニメ実行中はアニメ値が優先されて震えて落ちる動きのまま、
       アニメが終わる/wobble等でanimation-nameが差し替わった瞬間もtopはこの値に留まる(実測で画面外に消えた不具合の修正) */
    requestAnimationFrame(()=>cap.classList.add('drop','landed'));
    if(color==='gold'){ setTimeout(sndKyuin, 950); }
    if(color==='rainbow'){ setTimeout(()=>{ sndKyuin(); setTimeout(sndKyuin,220); }, 950); }
    /* 💡 割れ目から光が漏れる。レア度で色・強さを変える(判定ロジックには無関係の見た目だけ) */
    function leakTone(c){ return c==='rainbow' ? {v:'#fff',cls:'rainbow'} : c==='gold' ? {v:'#ffd54f',cls:'hot'} : {v:'#ffffff',cls:''}; }
    function setLeak(c){
      const lk=$('leak'); if(!lk) return;
      const t=leakTone(c);
      lk.style.setProperty('--leak', t.v);
      lk.classList.remove('hot','rainbow'); if(t.cls) lk.classList.add(t.cls);
      /* 2026-08-21: ハズレは光漏れを弱く=期待の温度を下げて当たりと体感差を出す */
      lk.classList.toggle('weak', !big);
    }
    setLeak(startColor);
    /* 2026-08-21: タメの震えもハズレは控えめに(wobble-lite) */
    setTimeout(()=>{ cap.classList.add(big ? 'wobble' : 'wobble-lite'); $('leak').classList.add('go'); }, 950);
    /* ✨ 色の昇格を「なかなか開かない」間に差し込む(期待煽り: 光の色も一緒に変わる) */
    function doUpgrade(newColor){
      sndKyuinUp();
      const uf=$('upflash'); if(uf){ uf.classList.remove('go'); void uf.offsetWidth; uf.classList.add('go'); }
      cap.className = cap.className.replace(/c-\S+/, 'c-'+newColor);
      cap.classList.remove('upgrading'); void cap.offsetWidth; cap.classList.add('upgrading');
      setLeak(newColor);
      $('rin').classList.remove('shakelite'); void $('rin').offsetWidth; $('rin').classList.add('shakelite');
      if(newColor==='rainbow'){ const rp=$('ringpulse'); rp.classList.remove('go'); void rp.offsetWidth; rp.classList.add('go'); }
    }
    const upgradeStart = 1450;
    upgradeSteps.forEach((step,i)=>{ setTimeout(()=>doUpgrade(step), upgradeStart + i*600); });
    const openAt = 2100 + (color!=='normal'? 700:0) + upgradeSteps.length*600;   /* 金・虹はなかなか開かない(二段階+昇格ぶん) */
    setTimeout(()=>{
      function proceedOpen(){
        if(!big){
          /* 2026-08-21: ハズレ専用の流れ。派手フラッシュなしで「ぽすっ」→
             煙がぽふっと出て消える→空っぽの下半分が残る→少し間を置いて
             大きく「…からっぽ!」(暗転を解除し明るい画面でしょんぼり登場) */
          cap.classList.add('openweak'); sndMiss();
          const sm=$('smoke'); if(sm){ sm.classList.remove('go'); void sm.offsetWidth; sm.classList.add('go'); }
          setTimeout(()=>{
            $('reveal').classList.add('bright');
            sndPofu();
            const prz=$('prz');
            prz.classList.add('miss');
            try{ localStorage.setItem('usagi_lastmiss', String(Date.now())); }catch(e){} /* 2026-09-02: 外れ直後の散歩うさぎ用 */
            prz.innerHTML=`<div class="name">…からっぽ!</div><button class="go-btn" onclick="closeReveal()">もういちど ▶</button>`;
            prz.classList.add('go');
          }, 520);
          finish();
        } else if(revive){
          /* 復活: 一度「からっぽ」→ カプセルが震えだして当たりへ */
          cap.classList.add('open'); sndMiss();
          $('prz').innerHTML=`<div class="name">…からっぽ?</div>`;
          $('prz').classList.add('go');
          setTimeout(()=>{
            $('prz').classList.remove('go');
            cap.classList.remove('open'); cap.classList.add('revive'); knock(0,0.12,700,0.9); knock(0.5,0.12,700,0.9);
            setTimeout(()=>{ cap.classList.remove('revive'); openPrize(cap); }, 1700);
          }, 1200);
        } else {
          openPrize(cap);
        }
      }
      const lk0=$('leak'); if(lk0) lk0.classList.remove('go');
      if(doCrack){
        /* 💥 ヒビ→ピシッ→1秒静止(無音)→パカーン+コンフェッティ */
        $('crack').classList.add('go');
        sndCrack();
        setTimeout(()=>{
          $('crack').classList.remove('go');
          sndBurst(); confettiBig(40);
          setTimeout(proceedOpen, 90);
        }, 1000);
      } else {
        proceedOpen();
      }
    }, openAt);
  }
  function openPrize(cap){
    cap.classList.add('open');
    $('flash') && $('flash').classList.add('go');
    $('rays') && $('rays').classList.add('go');
    spawnSparks($('rin'));
    sndJackpot(); screenFlash(); confetti();
    /* 🌈 最高レア(虹)は画面フラッシュを2回にして期待を超える演出に */
    if(color==='rainbow'){ setTimeout(screenFlash, 260); }
    $('machine').classList.add('excited');
    /* 2026-08-14〜: 大当たり=🎁宝箱3択へ。鍵の自動発行はしない(鍵は手配りのみ) */
    /* 2026-08-20: プレビュー中はC.showTreasurePicker(実キー発行)に触らず、演出だけ見せて閉じる */
    if(preview){
      $('prz').innerHTML=`<img class="pz" src="img/バツベイ_アイコン800.png">
        <div class="name">🎉 大あたり!!</div>
        <div style="font-size:15px;font-weight:900;margin-top:6px;color:#fff">プレビュー(実キーなし)</div>
        <button class="go-btn" onclick="closeReveal()">とじる ▶</button>`;
    } else {
      $('prz').innerHTML=`<img class="pz" src="img/バツベイ_アイコン800.png">
        <div class="name">🎉 大あたり!!</div>
        <div style="font-size:15px;font-weight:900;margin-top:6px;color:#fff">たからばこが とどいたよ!</div>
        <button class="go-btn" onclick="openChest()">たからばこを あける ▶</button>`;
    }
    $('prz').classList.add('go');
    finish();
  }
  /* きらきら破片を数個散らす(2026-08-17: カプセルが割れた感触を追加) */
  function spawnSparks(container){
    const n=7;
    for(let i=0;i<n;i++){
      const s=document.createElement('div');
      s.className='spark '+(i%2===0?'star':'dot');
      const ang=(i/n)*Math.PI*2 + (Math.random()*0.4-0.2);
      const dist=70+Math.random()*60;
      s.style.setProperty('--sx',(Math.cos(ang)*dist)+'px');
      s.style.setProperty('--sy',(Math.sin(ang)*dist)+'px');
      s.style.animation='sparkfly '+(0.75+Math.random()*0.25)+'s ease-out '+(0.15+Math.random()*0.25)+'s forwards';
      container.appendChild(s);
      setTimeout(()=>s.remove(), 1500);
    }
  }
  function finish(){ spinning=false; $('hnd').classList.remove('spin'); refresh(); }
}
$('hnd').onclick=()=>spin({});
function closeReveal(){ $('reveal').style.display='none'; $('reveal').classList.remove('bright'); $('rin').innerHTML=''; $('predim').classList.remove('go'); refresh(); }
function openChest(){
  closeReveal();
  C.showTreasurePicker({ onPick:()=>sndKyuin(), onReveal:()=>sndWin() });
}

/* ============================================================
   演出プレビュー パネル(2026-08-20・dev専用)
   ?dev=1 かつ localhost/127.0.0.1/192.168.x.xのときだけ右下に出す(スロット新台と同じ条件)。
   本番(公開サイト)では何も出ない。コインは使わず・宝箱の実キー発行(C.showTreasurePicker)も呼ばない=spin(preview:true)。
   ============================================================ */
const DEV_PREVIEW_ENABLED = (['localhost','127.0.0.1'].includes(location.hostname) || /^192\.168\./.test(location.hostname)) && /[?&]dev=1/.test(location.search);
if(DEV_PREVIEW_ENABLED){
  const DEV_BTNS=[
    {k:'normal',  label:'通常'},
    {k:'gold',    label:'金'},
    {k:'rainbow', label:'虹'},
    {k:'revive',  label:'復活'},
    {k:'up_ng',   label:'昇格 通常→金'},
    {k:'up_gr',   label:'昇格 金→虹'},
    {k:'up_ngr',  label:'昇格 通常→金→虹'},
    {k:'crack_g', label:'ヒビだけ(金)'},
    {k:'bigrand', label:'大当たり(ランダム演出)'},
    {k:'miss',    label:'はずれ'}
  ];
  const panel=document.createElement('div'); panel.id='devpanel';
  panel.innerHTML='<div class="devtitle">🛠 dev ガチャ v2.4</div>'+DEV_BTNS.map(b=>'<button data-k="'+b.k+'">'+b.label+'</button>').join('');
  document.body.appendChild(panel);
  function devForce(kind){
    if(spinning) return;
    const opts={preview:true};
    switch(kind){
      case 'normal':  opts.forceBig=true;  opts.forceColor='normal'; opts.forceRevive=false; opts.forceStartColor='normal'; opts.forceUpgradeSteps=[]; opts.forceDoCrack=false; break;
      case 'gold':    opts.forceBig=true;  opts.forceColor='gold';   opts.forceRevive=false; break;
      case 'rainbow': opts.forceBig=true;  opts.forceColor='rainbow';opts.forceRevive=false; break;
      case 'revive':  opts.forceBig=true;  opts.forceColor='normal'; opts.forceRevive=true; break;
      case 'up_ng':   opts.forceBig=true;  opts.forceColor='gold';   opts.forceRevive=false; opts.forceStartColor='normal'; opts.forceUpgradeSteps=['gold']; break;
      case 'up_gr':   opts.forceBig=true;  opts.forceColor='rainbow';opts.forceRevive=false; opts.forceStartColor='gold';   opts.forceUpgradeSteps=['rainbow']; break;
      case 'up_ngr':  opts.forceBig=true;  opts.forceColor='rainbow';opts.forceRevive=false; opts.forceStartColor='normal'; opts.forceUpgradeSteps=['gold','rainbow']; break;
      case 'crack_g': opts.forceBig=true;  opts.forceColor='gold';   opts.forceRevive=false; opts.forceStartColor='gold'; opts.forceUpgradeSteps=[]; opts.forceDoCrack=true; break;
      case 'bigrand': opts.forceBig=true; break; /* 演出はランダム抽選のまま */
      case 'miss':    opts.forceBig=false; break;
    }
    spin(opts);
  }
  panel.addEventListener('click', e=>{ const b=e.target.closest('button[data-k]'); if(b) devForce(b.dataset.k); });
}
</script>
<script>
/* 2026-08-15 iOS対策: overscroll-behaviorが効かないiPhone Safariで、下引っ張り更新(=ゲームリセット)を止める */
(function(){
  var sy=0;
  document.addEventListener('touchstart',function(e){ sy=e.touches[0].clientY; },{passive:true});
  document.addEventListener('touchmove',function(e){
    var se=document.scrollingElement||document.documentElement;
    if(se.scrollTop<=0 && e.touches[0].clientY>sy){ e.preventDefault(); }
  },{passive:false});
})();
</script>
</body>
