/* Actual app home plate: same photograph, font, 230x46 geometry and shadows. */
.hc-plate{margin:0;width:230px;padding:8px 0;text-align:center;border-radius:8px;background:url('assets/nameplate_metal.jpg') center/cover;border:3px solid #8f95a1;box-shadow:0 6px 10px rgba(0,0,0,.25),inset 0 1px 0 #fff;font:900 16px/24px KanaFont,'M PLUS Rounded 1c',sans-serif;letter-spacing:.0525em;color:#223;text-shadow:0 1px 0 #fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shop-plate{position:relative;display:inline-block;text-decoration:none;padding-inline:20px;overflow:visible}
.shop-plate::before,.shop-plate::after{content:'';position:absolute;top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;border:1px solid #737984;background:linear-gradient(135deg,transparent 42%,#606672 44%,#606672 52%,#c9cdd3 54%,transparent 57%),url('assets/nameplate_metal.jpg') center/cover;box-shadow:inset 0 1px 1px #ffffff80,0 1px 1px #0004}
.shop-plate::before{left:5px}.shop-plate::after{right:5px;transform:rotate(25deg)}
.shop-plate:hover{transform:translateY(-1px)}.shop-plate:active{transform:translateY(1px)}.shop-plate:focus-visible{outline:3px solid #175781;outline-offset:5px}
.back{display:inline-block;color:#175781;min-height:44px;margin-top:20px}
@media(max-width:600px){main{padding:18px 14px}}

/* Brighten the original metal photograph only, preserving text and shadows. */
.hc-plate{position:relative;background:none}
.plate-material{position:absolute;inset:0;border-radius:5px;background:url('assets/nameplate_metal.jpg') center/cover;filter:brightness(1.3);pointer-events:none;z-index:0}
.plate-label{position:relative;z-index:1;text-shadow:0 -1px 0 rgba(0,0,0,.2),0 1px 0 rgba(255,255,255,.95)}
.shop-plate::before,.shop-plate::after{z-index:2;filter:brightness(1.3)}
.light-letter .plate-label{color:#444854;text-shadow:0 1px 0 #fff,.5px 0 0 rgba(255,255,255,.65)}
.rabbit-size .plate-label{font-size:19.2px}
.slot-size .plate-label{font-size:17.6px}

.shop-plate::before,.shop-plate::after{border-color:#927743;background:linear-gradient(135deg,transparent 42%,#66502c 44%,#66502c 52%,#e7ce98 54%,transparent 57%),linear-gradient(rgba(192,145,52,.55),rgba(192,145,52,.55)),url('assets/nameplate_metal.jpg') center/cover;box-shadow:inset 0 1px 1px #fff0ccaa,0 1px 1px #0005}
