<h1>プレートの文字・別の3案</h1>
<p class="note">前の見本より丸さ・色・公式うさぎで違いを付けた3案です。メインのプレートは変更していません。</p>
<div class="samples">
<section class="sample sample-a"><h2>1　公式うさぎの小さな銘板</h2><div class="plates"><span class="shop-metal"><img class="plate-mascot" src="../img/usagi/cute_01.png" alt=""><span class="metal-title">tibiboard30 紹介 ▶</span></span><span class="shop-metal"><img class="plate-mascot" src="../img/usagi/cute_01.png" alt=""><span class="metal-title">うさぎ探し ▶</span></span></div><p class="desc">公式うさぎを小さく添えて、丸い文字で。</p></section>
<section class="sample sample-b"><h2>2　ベリーピンクの丸い文字</h2><div class="plates"><span class="shop-metal"><span class="metal-title">tibiboard30 紹介 ▶</span></span><span class="shop-metal"><span class="metal-title">うさぎ探し ▶</span></span></div><p class="desc">濃いピンクを入れた溝。背景に負けない太さ。</p></section>
<section class="sample sample-c"><h2>3　ふっくら白い浮き文字</h2><div class="plates"><span class="shop-metal"><span class="metal-title">tibiboard30 紹介 ▶</span></span><span class="shop-metal"><span class="metal-title">うさぎ探し ▶</span></span></div><p class="desc">これは刻印ではなく、丸く盛り上がった文字の案。</p></section>
